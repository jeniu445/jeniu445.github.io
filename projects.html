<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Projects — Jennifer Niu</title>


  <style>

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }


    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }



    :root{

      --bg:#fff;
      --text:#111;

      --t:200ms;

      --gallery-width:1020px;

      --gutter:28px;

      --panel-gap:18px;

      --banner-h:180px;

    }



    *{
      box-sizing:border-box;
    }



    body{

      margin:0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      background:
        var(--bg);

      color:
        var(--text);

      opacity:0;

      transition:
        opacity var(--t) ease;

    }



    body.page-loaded{

      opacity:1;

    }



    body.page-exit{

      opacity:0;

    }



    /* =========================
       TOP NAV
       ========================= */

    nav{

      position:absolute;

      top:0;
      left:0;

      width:100%;

      display:flex;

      justify-content:center;

      gap:2.2rem;

      padding:.9rem 0;

      z-index:10;

    }



    nav a{

      text-decoration:none;

      color:
        var(--text);

      font-size:.95rem;

      padding:.35rem .75rem;

      border-radius:999px;

      font-weight:700;

      transition:
        background 150ms,
        transform 150ms;

    }



    nav a:hover{

      background:
        rgba(0,0,0,.06);

      transform:
        translateY(-1px);

    }



    /* =========================
       PAGE
       ========================= */

    main{

      min-height:100dvh;

      padding:
        4.6rem 0 2rem;

    }



    .layout{

      width:100%;

      padding-left:
        var(--gutter);

      padding-right:
        var(--gutter);

      display:flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:16px;

    }



    /* =========================
       LEFT TABS
       ========================= */

    .side{

      display:flex;

      flex-direction:
        column;

      gap:10px;

      padding-top:2px;

    }



    .side a{

      text-decoration:none;

      color:#000;

      font-size:1.1rem;

      font-weight:700;

      letter-spacing:.15em;

      text-transform:
        uppercase;

      line-height:1;

      transition:
        opacity 160ms ease;

      width:fit-content;

    }



    .side a:hover{

      opacity:.55;

    }



    .side a.current{

      opacity:.35;

      pointer-events:none;

    }



    /* =========================
       RIGHT COLUMN
       ========================= */

    .gallery{

      width:
        var(--gallery-width);

      flex:
        0 0 var(--gallery-width);

    }



    .stack{

      display:flex;

      flex-direction:
        column;

      gap:
        var(--panel-gap);

    }



    /* =========================
       PROJECT BANNERS
       ========================= */

    .banner{

      position:relative;

      display:block;

      height:
        var(--banner-h);

      width:100%;

      overflow:hidden;

      text-decoration:none;

      color:#000;

      transform:
        translateZ(0);

      transition:
        transform 220ms ease,
        box-shadow 220ms ease;

      will-change:
        transform;

      perspective:900px;

    }



    .banner .bg{

      position:absolute;

      inset:0;

      background-size:
        cover;

      background-position:
        center;

      transform:
        scale(1);

      transition:
        transform 320ms ease,
        filter 220ms ease;

      will-change:
        transform;

      pointer-events:none;

    }



    /* White hover wash */

    .banner::after{

      content:"";

      position:absolute;

      inset:0;

      background:#fff;

      opacity:0;

      transition:
        opacity 220ms ease;

      pointer-events:none;

    }



    .banner:hover{

      transform:
        translateY(-2px)
        rotateX(2.2deg)
        rotateY(-2deg);

      box-shadow:
        0 14px 38px
        rgba(0,0,0,.12);

    }



    .banner:hover .bg{

      transform:
        scale(.985);

      filter:
        contrast(1.02)
        saturate(.95);

    }



    .banner:hover::after{

      opacity:.9;

    }



    /* =========================
       TITLE
       ========================= */

    .title{

      position:absolute;

      inset:0;

      display:flex;

      align-items:center;

      justify-content:center;

      opacity:0;

      transform:
        translateY(6px);

      transition:
        opacity 180ms ease,
        transform 180ms ease;

      user-select:none;

      pointer-events:none;

      z-index:2;

    }



    .banner:hover .title{

      opacity:1;

      transform:
        translateY(0);

    }



    .title span{

      background:
        transparent;

      padding:0;

      font-size:
        clamp(
          1.4rem,
          2.3vw,
          2.1rem
        );

      font-weight:700;

      letter-spacing:.12em;

      text-transform:
        uppercase;

      color:#000;

      text-align:center;

      line-height:1.05;

    }



    /* =========================
       LOADING
       ========================= */

    .loading{

      font-size:.8rem;

      font-weight:700;

      letter-spacing:.1em;

      text-transform:
        uppercase;

      opacity:.35;

    }



    /* =========================
       RESPONSIVE
       ========================= */

    @media(max-width:1180px){

      .layout{

        flex-direction:
          column;

        align-items:center;

        justify-content:
          flex-start;

        gap:6px;

      }



      .side{

        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex-direction:
          row;

        flex-wrap:
          wrap;

        gap:12px;

        padding-top:0;

      }



      .gallery{

        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;

      }



      .banner{

        height:170px;

      }

    }



    @media(max-width:700px){

      .banner{

        height:150px;

      }



      .title span{

        font-size:1rem;

      }

    }

  </style>

</head>



<body>


  <nav>

    <a href="index.html" data-nav>
      Home
    </a>

    <a href="portfolio.html" data-nav>
      Portfolio
    </a>

    <a href="about.html" data-nav>
      About
    </a>

  </nav>



  <main>

    <div class="layout">


      <aside class="side">

        <a
          href="portfolio.html"
          data-nav
        >
          Artworks
        </a>


        <a
          href="projects.html"
          class="current"
        >
          Projects
        </a>


        <a
          href="photography.html"
          data-nav
        >
          Photography
        </a>

      </aside>



      <div class="gallery">

        <div
          class="stack"
          id="projectStack"
        >

          <div class="loading">
            Loading projects...
          </div>

        </div>

      </div>


    </div>

  </main>



  <script>

    /* =========================
       PAGE FADE
       ========================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add(
            "page-loaded"
          );

      }
    );



    document
      .querySelectorAll(
        "a[data-nav]"
      )
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();

            document.body
              .classList
              .add(
                "page-exit"
              );

            setTimeout(
              () => {

                location.href =
                  link.href;

              },
              200
            );

          }
        );

      });



    /* =========================
       LOAD PROJECT INDEX
       ========================= */

    const projectStack =
      document.getElementById(
        "projectStack"
      );



    async function loadProjects(){

      try{

        const response =
          await fetch(
            "/content/projects/index.json",
            {
              cache:"no-store"
            }
          );


        if(!response.ok){

          throw new Error(
            "Could not load project index"
          );

        }



        const data =
          await response.json();



        const projects =
          data.projects || [];



        projectStack.innerHTML =
          "";



        projects.forEach(
          project => {


            const banner =
              document.createElement(
                "a"
              );


            banner.className =
              "banner";


            banner.href =
              `project.html?project=${
                encodeURIComponent(
                  project.slug
                )
              }`;



            const bg =
              document.createElement(
                "div"
              );


            bg.className =
              "bg";


            bg.style.backgroundImage =
              `url("${project.banner}")`;



            const title =
              document.createElement(
                "div"
              );


            title.className =
              "title";


            const span =
              document.createElement(
                "span"
              );


            span.textContent =
              project.title;



            title.appendChild(
              span
            );


            banner.appendChild(
              bg
            );


            banner.appendChild(
              title
            );


            projectStack.appendChild(
              banner
            );

          }
        );


      }
      catch(error){

        console.error(
          error
        );


        projectStack.innerHTML =
          `
            <div class="loading">
              Projects could not load.
            </div>
          `;

      }

    }



    loadProjects();

  </script>

</body>
</html>
