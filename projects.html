<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Jennifer Niu</title>

  <style>
    @font-face {
      font-family: "SpaceMono";
      src: url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SpaceMono";
      src: url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #fff;
      --text: #111;
      --t: 200ms;

      --gallery-width: 1020px;
      --gutter: 28px;
      --panel-gap: 18px;
      --banner-h: 180px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      background: var(--bg);
      color: var(--text);
      opacity: 0;
      transition: opacity var(--t) ease;
    }

    body.page-loaded {
      opacity: 1;
    }

    body.page-exit {
      opacity: 0;
    }

    /* =========================
       TOP NAVIGATION
       ========================= */

    nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2.2rem;
      padding: .9rem 0;
      z-index: 10;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-size: .95rem;
      padding: .35rem .75rem;
      border-radius: 999px;
      font-weight: 700;
      transition:
        background 150ms,
        transform 150ms;
    }

    nav a:hover {
      background: rgba(0,0,0,.06);
      transform: translateY(-1px);
    }

    /* =========================
       PAGE
       ========================= */

    main {
      min-height: 100dvh;
      padding: 4.6rem 0 2rem;
    }

    .layout {
      width: 100%;
      padding-left: var(--gutter);
      padding-right: var(--gutter);

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    /* =========================
       LEFT NAVIGATION
       ========================= */

    .side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 2px;
    }

    .side a {
      text-decoration: none;
      color: #000;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      line-height: 1;
      transition: opacity 160ms ease;
      width: fit-content;
    }

    .side a:hover {
      opacity: .55;
    }

    .side a.current {
      opacity: .35;
      pointer-events: none;
    }

    /* =========================
       PROJECT COLUMN
       ========================= */

    .gallery {
      width: var(--gallery-width);
      flex: 0 0 var(--gallery-width);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: var(--panel-gap);
    }

    /* =========================
       PROJECT BANNERS
       ========================= */

    .banner {
      position: relative;
      display: block;

      width: 100%;
      height: var(--banner-h);

      overflow: hidden;

      text-decoration: none;
      color: #000;

      transform: translateZ(0);

      transition:
        transform 220ms ease,
        box-shadow 220ms ease;

      will-change: transform;
      perspective: 900px;
    }

    /* project image */

    .banner .bg {
      position: absolute;
      inset: 0;

      background-size: cover;
      background-position: center;

      transform: scale(1);

      transition:
        transform 320ms ease,
        filter 220ms ease;

      will-change: transform;
      pointer-events: none;
    }

    /* white overlay */

    .banner::after {
      content: "";

      position: absolute;
      inset: 0;

      background: rgba(255,255,255,0);

      transition: background 220ms ease;

      pointer-events: none;
    }

    /* hover */

    .banner:hover {
      transform:
        translateY(-2px)
        rotateX(2.2deg)
        rotateY(-2deg);

      box-shadow:
        0 14px 38px rgba(0,0,0,.12);
    }

    .banner:hover .bg {
      transform: scale(1.015);
    }

    .banner:hover::after {
      background: rgba(255,255,255,.42);
    }

    /* =========================
       PROJECT TITLE
       ========================= */

    .title {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;

      transform: translateY(6px);

      transition:
        opacity 180ms ease,
        transform 180ms ease;

      user-select: none;
      pointer-events: none;

      z-index: 2;
    }

    .banner:hover .title {
      opacity: 1;
      transform: translateY(0);
    }

    /*
      No white box around title.
      Text sits directly over the
      whitened project image.
    */

    .title span {
      background: none;
      padding: 0;

      font-size: 1.6rem;
      font-weight: 700;

      letter-spacing: .14em;
      text-transform: uppercase;

      color: #000;
    }

    /* =========================
       ERROR / EMPTY STATES
       ========================= */

    .message {
      padding: 2rem 0;

      font-size: .95rem;
      line-height: 1.6;

      color: rgba(0,0,0,.55);
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 1180px) {

      .layout {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 6px;
      }

      .side {
        width: min(100%, var(--gallery-width));

        flex-direction: row;
        flex-wrap: wrap;

        gap: 12px;

        padding-top: 0;
      }

      .gallery {
        width: min(100%, var(--gallery-width));
        flex: 0 1 auto;
      }

      .banner {
        height: 170px;
      }
    }

    @media (max-width: 700px) {

      .banner {
        height: 150px;
      }

      .title span {
        font-size: 1.25rem;
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       TOP NAV
       ========================= -->

  <nav>
    <a href="index.html" data-nav>Home</a>
    <a href="portfolio.html" data-nav>Portfolio</a>
    <a href="about.html" data-nav>About</a>
  </nav>


  <main>

    <div class="layout">

      <!-- =====================
           LEFT NAV
           ===================== -->

      <aside class="side">

        <a href="portfolio.html" data-nav>
          Artworks
        </a>

        <a href="projects.html" class="current">
          Projects
        </a>

        <a href="photography.html" data-nav>
          Photography
        </a>

      </aside>


      <!-- =====================
           PROJECTS
           ===================== -->

      <div class="gallery">

        <div
          class="stack"
          id="projectStack">
        </div>

      </div>

    </div>

  </main>


  <script>

    /* ==========================================
       PAGE FADE
       ========================================== */

    window.addEventListener("load", () => {
      document.body.classList.add("page-loaded");
    });


    /* ==========================================
       NAVIGATION FADE
       ========================================== */

    document
      .querySelectorAll("a[data-nav]")
      .forEach(link => {

        link.addEventListener("click", e => {

          e.preventDefault();

          document.body.classList.add("page-exit");

          setTimeout(() => {
            window.location.href = link.href;
          }, 200);

        });

      });


    /* ==========================================
       LOAD PROJECTS FROM DECAP
       ========================================== */

    async function loadProjects() {

      const stack =
        document.getElementById("projectStack");

      try {

        /*
          Prevent browser from showing an old
          cached version after publishing.
        */

        const response = await fetch(
          "/content/projects.json?v=" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "Could not load projects.json"
          );
        }

        const data = await response.json();

        const projects =
          Array.isArray(data.projects)
            ? data.projects
            : [];


        /* ==============================
           NO PROJECTS
           ============================== */

        if (projects.length === 0) {

          stack.innerHTML = `
            <div class="message">
              No projects have been added yet.
            </div>
          `;

          return;
        }


        /* ==============================
           CREATE EACH PROJECT BANNER
           ============================== */

        projects.forEach(project => {

          if (!project.title) {
            return;
          }


          /* ------------------------------
             Banner
             ------------------------------ */

          const banner =
            document.createElement("a");

          banner.className = "banner";


          /*
            EXISTING PROJECT:

            Uses its original custom HTML page.

            NEW PROJECT:

            Uses project.html and its CMS slug.
          */

          if (project.url) {

            banner.href = project.url;

          } else {

            banner.href =
              "project.html?project=" +
              encodeURIComponent(project.slug);

          }


          /* ------------------------------
             Background
             ------------------------------ */

          const bg =
            document.createElement("div");

          bg.className = "bg";

          if (project.banner) {

            bg.style.backgroundImage =
              `url("${project.banner}")`;

          }


          /* ------------------------------
             Title
             ------------------------------ */

          const title =
            document.createElement("div");

          title.className = "title";


          const titleText =
            document.createElement("span");

          titleText.textContent =
            project.title;


          title.appendChild(titleText);

          banner.appendChild(bg);

          banner.appendChild(title);

          stack.appendChild(banner);

        });


      } catch (error) {

        console.error(
          "Error loading projects:",
          error
        );

        stack.innerHTML = `
          <div class="message">
            Projects could not be loaded.
          </div>
        `;

      }

    }


    loadProjects();

  </script>

</body>
</html>
