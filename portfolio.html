<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Portfolio — Jennifer Niu</title>


  <style>

    /* =========================================================
       FONT
       ========================================================= */

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root{
      --bg:#fff;
      --text:#111;

      --t:200ms;

      --gallery-width:1020px;

      --gutter:28px;

      --gap:18px;

      --links-width:190px;
    }


    *{
      box-sizing:border-box;
    }


    html{
      scrollbar-gutter:stable;
    }


    body{
      margin:0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      background:var(--bg);

      color:var(--text);

      opacity:0;

      transition:
        opacity var(--t) ease;
    }


    body.page-loaded{
      opacity:1;
    }


    body.page-exit{
      opacity:0;
    }


    body.lock-scroll{
      overflow:hidden;

      padding-right:
        var(--sbw,0px);
    }


    /* =========================================================
       TOP NAV
       ========================================================= */

    nav{
      position:absolute;

      top:0;
      left:0;

      width:100%;

      display:flex;

      justify-content:center;

      gap:2.2rem;

      padding:.9rem 0;

      z-index:10;
    }


    nav a{
      text-decoration:none;

      color:var(--text);

      font-size:.95rem;

      font-weight:700;

      padding:.35rem .75rem;

      border-radius:999px;

      transition:
        background 150ms ease,
        transform 150ms ease;

      user-select:none;
    }


    nav a:hover{
      background:rgba(0,0,0,.06);

      transform:
        translateY(-1px);
    }


    /* =========================================================
       PAGE
       ========================================================= */

    main{
      min-height:100dvh;

      padding:
        4.6rem 0 1.2rem;
    }


    .layout{
      width:100%;

      padding-left:
        var(--gutter);

      padding-right:
        var(--gutter);

      display:flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:16px;
    }


    /* =========================================================
       LEFT NAV
       ========================================================= */

    .side{
      width:
        var(--links-width);

      flex:
        0 0 var(--links-width);

      display:flex;

      flex-direction:
        column;

      gap:10px;

      padding-top:2px;
    }


    .side a{
      text-decoration:none;

      color:#000;

      font-size:1.1rem;

      font-weight:700;

      letter-spacing:.15em;

      text-transform:uppercase;

      line-height:1;

      transition:
        opacity 160ms ease;

      width:fit-content;

      user-select:none;
    }


    .side a:hover{
      opacity:.55;
    }


    .side a.current{
      opacity:.35;

      pointer-events:none;
    }


    /* =========================================================
       NORMAL GALLERY
       ========================================================= */

    .gallery{
      width:
        var(--gallery-width);

      flex:
        0 0 var(--gallery-width);
    }


    /* =========================================================
       VIEW ICONS
       ========================================================= */

    .view-toggle{
      width:78%;

      margin:
        0 auto 14px;

      display:flex;

      justify-content:flex-end;

      gap:10px;
    }


    .view-btn{
      appearance:none;

      border:0;

      background:transparent;

      padding:3px;

      color:#111;

      cursor:pointer;

      opacity:.25;

      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }


    .view-btn:hover{
      opacity:.6;

      transform:
        translateY(-1px);
    }


    .view-btn.active{
      opacity:1;
    }


    .view-btn svg{
      width:20px;
      height:20px;

      fill:none;

      stroke:currentColor;

      stroke-width:1.6;

      stroke-linecap:round;

      stroke-linejoin:round;
    }


    /* =========================================================
       SINGLE COLUMN
       ========================================================= */

    .artwork-stack{
      width:78%;

      margin:0 auto;

      display:flex;

      flex-direction:column;

      gap:var(--gap);
    }


    /* =========================================================
       TILE
       ========================================================= */

    .tile{
      width:100%;

      margin:0;
    }


    .media{
      display:block;

      width:100%;

      transform:
        scale(1);

      transition:
        transform 260ms
        cubic-bezier(.2,.8,.2,1);

      transform-origin:
        center center;

      will-change:
        transform;

      cursor:zoom-in;
    }


    .tile:hover .media{
      transform:
        scale(.985);
    }


    body.collage-mode
    .tile:hover
    .media{
      transform:
        scale(.96);
    }


    .media img{
      display:block;

      width:100%;

      height:auto;

      cursor:zoom-in;
    }


    /* =========================================================
       FULL SCREEN COLLAGE MODE
       ========================================================= */

    body.collage-mode .layout{
      display:block;

      padding-left:0;
      padding-right:0;
    }


    body.collage-mode .side{
      display:none;
    }


    body.collage-mode .gallery{
      width:100%;

      max-width:none;

      flex:none;
    }


    body.collage-mode .view-toggle{
      width:100%;

      margin:
        0 0 14px;

      padding:
        0 28px;

      justify-content:flex-end;
    }


    /* =========================================================
       PUBLIC COLLAGE VIEWPORT
       ========================================================= */

    .collage-public-viewport{
      display:none;

      position:relative;

      width:100%;

      overflow:hidden;
    }


    body.collage-mode
    .collage-public-viewport{
      display:block;
    }


    /*
      Fixed virtual artboard.
      MUST match admin/index.html.
    */

    .collage-public-artboard{
      position:absolute;

      top:0;
      left:0;

      width:1600px;

      transform-origin:
        top left;
    }


    .collage-public-artboard .tile{
      position:absolute;

      margin:0;
    }


    body.collage-mode
    #artworkGallery{
      display:none;
    }


    /* =========================================================
       LOADING
       ========================================================= */

    .gallery-loading{
      font-size:.8rem;

      opacity:.35;

      letter-spacing:.1em;

      text-transform:uppercase;

      padding:10px;
    }


    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .lightbox{
      position:fixed;

      inset:0;

      background:
        rgba(0,0,0,.85);

      display:flex;

      align-items:center;

      justify-content:center;

      opacity:0;

      pointer-events:none;

      transition:
        opacity 220ms ease;

      z-index:9999;
    }


    .lightbox.open{
      opacity:1;

      pointer-events:auto;
    }


    .lightbox img{
      max-width:90vw;

      max-height:90vh;

      width:auto;

      height:auto;

      object-fit:contain;

      transform:
        scale(.96);

      opacity:0;

      transition:
        transform 240ms
        cubic-bezier(.2,.8,.2,1),
        opacity 240ms ease;
    }


    .lightbox.open img{
      transform:
        scale(1);

      opacity:1;
    }


    .lightbox-close{
      position:absolute;

      top:20px;

      right:26px;

      font-family:
        "SpaceMono",
        monospace;

      font-size:32px;

      font-weight:400;

      background:none;

      border:none;

      color:white;

      cursor:pointer;

      line-height:1;

      opacity:.7;

      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }


    .lightbox-close:hover{
      opacity:1;

      transform:
        scale(1.08);
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width:1180px){

      .layout{
        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        gap:10px;
      }


      .side{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;

        flex-direction:row;

        flex-wrap:wrap;

        gap:12px;

        padding-top:0;
      }


      .gallery{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;
      }


      body.collage-mode .layout{
        display:block;

        padding-left:0;
        padding-right:0;
      }


      body.collage-mode .gallery{
        width:100%;
      }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width:700px){

      .layout{
        padding-left:16px;

        padding-right:16px;
      }


      .artwork-stack{
        width:100%;
      }


      .view-toggle{
        width:100%;
      }


      body.collage-mode
      .view-toggle{
        padding-left:16px;

        padding-right:16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       NAVIGATION
       ========================================================= -->

  <nav>

    <a
      href="index.html"
      data-nav>
      Home
    </a>

    <a
      href="portfolio.html"
      data-nav>
      Portfolio
    </a>

    <a
      href="about.html"
      data-nav>
      About
    </a>

  </nav>


  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div
    class="lightbox"
    id="lightbox">

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image">
      ×
    </button>

    <img
      id="lightboxImg"
      src=""
      alt="">

  </div>


  <!-- =========================================================
       PAGE
       ========================================================= -->

  <main>

    <div class="layout">


      <!-- LEFT NAV -->

      <aside class="side">

        <a
          href="portfolio.html"
          class="current">
          Artworks
        </a>

        <a
          href="projects.html"
          data-nav>
          Projects
        </a>

        <a
          href="photography.html"
          data-nav>
          Photography
        </a>

      </aside>


      <!-- RIGHT / FULL COLLAGE -->

      <div class="gallery">


        <!-- VIEW ICONS -->

        <div class="view-toggle">


          <!-- SINGLE COLUMN -->

          <button
            class="view-btn active"
            id="singleView"
            type="button"
            aria-label="Single column view"
            title="Single column view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="7"
                y="3"
                width="10"
                height="18"
                rx="1">
              </rect>

            </svg>

          </button>


          <!-- COLLAGE -->

          <button
            class="view-btn"
            id="collageView"
            type="button"
            aria-label="Collage view"
            title="Collage view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="2"
                y="3"
                width="8"
                height="6"
                rx="1">
              </rect>

              <rect
                x="14"
                y="2"
                width="7"
                height="9"
                rx="1">
              </rect>

              <rect
                x="5"
                y="13"
                width="7"
                height="8"
                rx="1">
              </rect>

              <rect
                x="15"
                y="15"
                width="6"
                height="5"
                rx="1">
              </rect>

            </svg>

          </button>

        </div>


        <!-- ===================================================
             SINGLE COLUMN
             =================================================== -->

        <section
          class="artwork-stack"
          id="artworkGallery">

          <div class="gallery-loading">
            Loading artwork...
          </div>

        </section>


        <!-- ===================================================
             COLLAGE
             =================================================== -->

        <div
          class="collage-public-viewport"
          id="collageViewport">

          <div
            class="collage-public-artboard"
            id="collageArtboard">
          </div>

        </div>


      </div>


    </div>

  </main>


  <script>

    /* =========================================================
       DESIGN SYSTEM
       ========================================================= */

    const DESIGN_WIDTH =
      1600;


    const MIN_DESIGN_HEIGHT =
      1100;


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const artworkGallery =
      document.getElementById(
        "artworkGallery"
      );


    const collageViewport =
      document.getElementById(
        "collageViewport"
      );


    const collageArtboard =
      document.getElementById(
        "collageArtboard"
      );


    const singleView =
      document.getElementById(
        "singleView"
      );


    const collageView =
      document.getElementById(
        "collageView"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImg =
      document.getElementById(
        "lightboxImg"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    let artworks =
      [];


    let collageLayout =
      [];


    let currentView =
      "single";


    let collageDesignHeight =
      MIN_DESIGN_HEIGHT;


    /* =========================================================
       PAGE FADE
       ========================================================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add(
            "page-loaded"
          );

      }
    );


    /* =========================================================
       NAVIGATION
       ========================================================= */

    document
      .querySelectorAll(
        "a[data-nav]"
      )
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();


            document.body
              .classList
              .add(
                "page-exit"
              );


            setTimeout(
              () => {

                window.location.href =
                  link.href;

              },
              200
            );

          }
        );

      });


    /* =========================================================
       CREATE ARTWORK TILE
       ========================================================= */

    function createArtworkTile(
      artwork,
      index
    ){

      const tile =
        document.createElement(
          "div"
        );


      tile.className =
        "tile";


      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        artwork.image;


      img.alt =
        artwork.alt ||
        `Portfolio artwork ${index + 1}`;


      img.loading =
        index < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.addEventListener(
        "click",
        () => {

          openLightbox(
            img.currentSrc ||
            img.src,
            img.alt
          );

        }
      );


      img.addEventListener(
        "error",
        () => {

          console.error(
            "Missing artwork:",
            artwork.image
          );

        }
      );


      media.appendChild(
        img
      );


      tile.appendChild(
        media
      );


      return tile;

    }


    /* =========================================================
       SINGLE COLUMN
       ========================================================= */

    function buildSingleColumn(){

      currentView =
        "single";


      document.body
        .classList
        .remove(
          "collage-mode"
        );


      artworkGallery.innerHTML =
        "";


      artworks.forEach(
        (
          artwork,
          index
        ) => {

          artworkGallery.appendChild(
            createArtworkTile(
              artwork,
              index
            )
          );

        }
      );


      singleView
        .classList
        .add(
          "active"
        );


      collageView
        .classList
        .remove(
          "active"
        );

    }


    /* =========================================================
       NORMALIZE COLLAGE POSITION

       Supports BOTH:

       OLD FORMAT:
       x = percent
       width = percent

       NEW FORMAT:
       x = design px
       width = design px
       ========================================================= */

    function normalizeCollageItem(
      item
    ){

      let x =
        Number(
          item.x
        ) || 0;


      const y =
        Number(
          item.y
        ) || 0;


      let width =
        Number(
          item.width
        ) || 400;


      /*
        If width is <= 100, assume this is
        old percentage-based data.
      */

      if(
        width <= 100
      ){

        x =
          (
            x /
            100
          ) *
          DESIGN_WIDTH;


        width =
          (
            width /
            100
          ) *
          DESIGN_WIDTH;

      }


      return{

        image:
          item.image,

        x:
          x,

        y:
          y,

        width:
          width

      };

    }


    /* =========================================================
       BUILD COLLAGE
       ========================================================= */

    function buildCollage(){

      collageArtboard.innerHTML =
        "";


      const artworkByImage =
        {};


      artworks.forEach(
        artwork => {

          if(
            artwork &&
            artwork.image
          ){

            artworkByImage[
              artwork.image
            ] =
              artwork;

          }

        }
      );


      let maximumBottom =
        MIN_DESIGN_HEIGHT;


      collageLayout.forEach(
        (
          rawItem,
          index
        ) => {


          if(
            !rawItem ||
            !rawItem.image
          ){

            return;

          }


          const item =
            normalizeCollageItem(
              rawItem
            );


          const artwork =
            artworkByImage[
              item.image
            ];


          if(
            !artwork
          ){

            return;

          }


          const tile =
            createArtworkTile(
              artwork,
              index
            );


          tile.style.position =
            "absolute";


          tile.style.left =
            item.x +
            "px";


          tile.style.top =
            item.y +
            "px";


          tile.style.width =
            item.width +
            "px";


          collageArtboard.appendChild(
            tile
          );


          const img =
            tile.querySelector(
              "img"
            );


          const updateHeight =
            () => {

              const bottom =
                item.y +
                tile.offsetHeight;


              maximumBottom =
                Math.max(
                  maximumBottom,
                  bottom +
                  100
                );


              collageDesignHeight =
                maximumBottom;


              collageArtboard.style.height =
                collageDesignHeight +
                "px";


              updatePublicCollageScale();

            };


          if(
            img.complete
          ){

            updateHeight();

          }
          else{

            img.addEventListener(
              "load",
              updateHeight,
              {
                once:true
              }
            );


            img.addEventListener(
              "error",
              updateHeight,
              {
                once:true
              }
            );

          }

        }
      );


      collageDesignHeight =
        maximumBottom;


      collageArtboard.style.height =
        collageDesignHeight +
        "px";

    }


    /* =========================================================
       SCALE COLLAGE
       ========================================================= */

    function updatePublicCollageScale(){

      if(
        currentView !==
        "collage"
      ){

        return;

      }


      const availableWidth =
        collageViewport.clientWidth;


      if(
        !availableWidth
      ){

        return;

      }


      /*
        Scale entire virtual artboard.
      */

      const scale =
        availableWidth /
        DESIGN_WIDTH;


      collageArtboard.style.transform =
        `scale(${scale})`;


      /*
        Transform doesn't affect parent height,
        so set the viewport height manually.
      */

      collageViewport.style.height =
        (
          collageDesignHeight *
          scale
        ) +
        "px";

    }


    /* =========================================================
       SHOW COLLAGE
       ========================================================= */

    function showCollage(){

      currentView =
        "collage";


      document.body
        .classList
        .add(
          "collage-mode"
        );


      collageView
        .classList
        .add(
          "active"
        );


      singleView
        .classList
        .remove(
          "active"
        );


      buildCollage();


      requestAnimationFrame(
        updatePublicCollageScale
      );

    }


    /* =========================================================
       VIEW BUTTONS
       ========================================================= */

    singleView
      .addEventListener(
        "click",
        buildSingleColumn
      );


    collageView
      .addEventListener(
        "click",
        showCollage
      );


    /* =========================================================
       LOAD DATA
       ========================================================= */

    async function loadPortfolioData(){

      try{

        const [
          artworkResponse,
          collageResponse
        ] =
          await Promise.all([


            fetch(
              "/content/artworks.json?v=" +
              Date.now(),
              {
                cache:"no-store"
              }
            ),


            fetch(
              "/content/collage.json?v=" +
              Date.now(),
              {
                cache:"no-store"
              }
            )


          ]);


        if(
          !artworkResponse.ok
        ){

          throw new Error(
            "Could not load artworks.json"
          );

        }


        if(
          !collageResponse.ok
        ){

          throw new Error(
            "Could not load collage.json"
          );

        }


        const artworkData =
          await artworkResponse.json();


        const collageData =
          await collageResponse.json();


        artworks =
          Array.isArray(
            artworkData.artworks
          )
            ? artworkData.artworks
            : [];


        collageLayout =
          Array.isArray(
            collageData.layout
          )
            ? collageData.layout
            : [];


        buildSingleColumn();

      }

      catch(error){

        console.error(
          "Portfolio loading error:",
          error
        );


        artworkGallery.innerHTML =
          `
          <div class="gallery-loading">
            Portfolio could not load.
          </div>
          `;

      }

    }


    /* =========================================================
       RESIZE
       ========================================================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if(
                currentView ===
                "collage"
              ){

                updatePublicCollageScale();

              }

            },
            100
          );

      }
    );


    /* =========================================================
       LIGHTBOX
       ========================================================= */

    function getScrollbarWidth(){

      return (
        window.innerWidth -
        document
          .documentElement
          .clientWidth
      );

    }


    function openLightbox(
      src,
      alt
    ){

      lightboxImg.src =
        src;


      lightboxImg.alt =
        alt || "";


      document
        .documentElement
        .style
        .setProperty(
          "--sbw",
          getScrollbarWidth() +
          "px"
        );


      document.body
        .classList
        .add(
          "lock-scroll"
        );


      lightbox
        .classList
        .add(
          "open"
        );

    }


    function closeLightbox(){

      lightbox
        .classList
        .remove(
          "open"
        );


      document.body
        .classList
        .remove(
          "lock-scroll"
        );


      setTimeout(
        () => {

          if(
            !lightbox
              .classList
              .contains(
                "open"
              )
          ){

            lightboxImg.src =
              "";

          }

        },
        240
      );

    }


    lightboxClose
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          closeLightbox();

        }
      );


    lightbox
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            lightbox
          ){

            closeLightbox();

          }

        }
      );


    window.addEventListener(
      "keydown",
      event => {

        if(
