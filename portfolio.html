<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Portfolio — Jennifer Niu</title>

  <style>

    /* =========================================================
       FONT
       ========================================================= */

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root{
      --bg:#fff;
      --text:#111;

      --t:200ms;

      --gallery-width:1020px;

      --gutter:28px;

      --gap:18px;

      --links-width:190px;
    }


    *{
      box-sizing:border-box;
    }


    html{
      scrollbar-gutter:stable;
    }


    body{
      margin:0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      background:var(--bg);

      color:var(--text);

      opacity:0;

      transition:
        opacity var(--t) ease;
    }


    body.page-loaded{
      opacity:1;
    }


    body.page-exit{
      opacity:0;
    }


    body.lock-scroll{
      overflow:hidden;

      padding-right:
        var(--sbw,0px);
    }



    /* =========================================================
       TOP NAV
       ========================================================= */

    nav{
      position:absolute;

      top:0;
      left:0;

      width:100%;

      display:flex;

      justify-content:center;

      gap:2.2rem;

      padding:.9rem 0;

      z-index:10;
    }


    nav a{
      text-decoration:none;

      color:var(--text);

      font-size:.95rem;

      font-weight:700;

      padding:.35rem .75rem;

      border-radius:999px;

      transition:
        background 150ms ease,
        transform 150ms ease;

      user-select:none;
    }


    nav a:hover{
      background:rgba(0,0,0,.06);

      transform:
        translateY(-1px);
    }



    /* =========================================================
       PAGE
       ========================================================= */

    main{
      min-height:100dvh;

      padding:
        4.6rem 0 1.2rem;
    }


    .layout{
      width:100%;

      padding-left:
        var(--gutter);

      padding-right:
        var(--gutter);

      display:flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:16px;
    }



    /* =========================================================
       LEFT NAV
       ========================================================= */

    .side{
      width:
        var(--links-width);

      flex:
        0 0 var(--links-width);

      display:flex;

      flex-direction:
        column;

      gap:10px;

      padding-top:2px;
    }


    .side a{
      text-decoration:none;

      color:#000;

      font-size:1.1rem;

      font-weight:700;

      letter-spacing:.15em;

      text-transform:
        uppercase;

      line-height:1;

      transition:
        opacity 160ms ease;

      width:fit-content;

      user-select:none;
    }


    .side a:hover{
      opacity:.55;
    }


    .side a.current{
      opacity:.35;

      pointer-events:none;
    }



    /* =========================================================
       GALLERY
       ========================================================= */

    .gallery{
      width:
        var(--gallery-width);

      flex:
        0 0 var(--gallery-width);
    }



    /* =========================================================
       VIEW ICONS
       ========================================================= */

    .view-toggle{
      width:78%;

      margin:
        0 auto 14px;

      display:flex;

      justify-content:flex-end;

      gap:10px;
    }


    .view-btn{
      appearance:none;

      border:0;

      background:transparent;

      padding:3px;

      color:#111;

      cursor:pointer;

      opacity:.25;

      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }


    .view-btn:hover{
      opacity:.6;

      transform:
        translateY(-1px);
    }


    .view-btn.active{
      opacity:1;
    }


    .view-btn svg{
      width:20px;
      height:20px;

      fill:none;

      stroke:currentColor;

      stroke-width:1.6;

      stroke-linecap:round;

      stroke-linejoin:round;
    }



    /* =========================================================
       DEFAULT SINGLE COLUMN
       ========================================================= */

    .artwork-stack{
      width:78%;

      margin:0 auto;

      display:flex;

      flex-direction:column;

      gap:var(--gap);
    }



    /* =========================================================
       FULL / ORBIT VIEW
       ========================================================= */

    .artwork-stack.orbit-view{
      width:100%;

      margin:0;

      display:block;

      position:relative;

      min-height:500px;
    }


    .artwork-stack.orbit-view .tile{
      position:absolute;

      margin:0;

      transition:
        opacity 220ms ease;
    }



    /* =========================================================
       ARTWORK
       ========================================================= */

    .tile{
      width:100%;

      margin:0;
    }


    .media{
      display:block;

      width:100%;

      transform:scale(1);

      transition:
        transform 220ms ease;

      will-change:transform;

      cursor:zoom-in;
    }


    .tile:hover .media{
      transform:
        scale(.985);
    }


    .media img{
      display:block;

      width:100%;

      height:auto;

      cursor:zoom-in;
    }



    /* =========================================================
       LOADING
       ========================================================= */

    .gallery-loading{
      font-size:.8rem;

      opacity:.35;

      letter-spacing:.1em;

      text-transform:uppercase;

      padding:10px;
    }



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .lightbox{
      position:fixed;

      inset:0;

      background:
        rgba(0,0,0,.85);

      display:flex;

      align-items:center;

      justify-content:center;

      opacity:0;

      pointer-events:none;

      transition:
        opacity 220ms ease;

      z-index:9999;
    }


    .lightbox.open{
      opacity:1;

      pointer-events:auto;
    }


    .lightbox img{
      max-width:90vw;

      max-height:90vh;

      width:auto;

      height:auto;

      object-fit:contain;

      transform:
        scale(.96);

      opacity:0;

      transition:
        transform 240ms
        cubic-bezier(.2,.8,.2,1),
        opacity 240ms ease;
    }


    .lightbox.open img{
      transform:
        scale(1);

      opacity:1;
    }


    .lightbox-close{
      position:absolute;

      top:20px;

      right:26px;

      font-family:
        "SpaceMono",
        monospace;

      font-size:32px;

      font-weight:400;

      background:none;

      border:none;

      color:white;

      cursor:pointer;

      line-height:1;

      opacity:.7;

      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }


    .lightbox-close:hover{
      opacity:1;

      transform:
        scale(1.08);
    }



    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width:1180px){

      .layout{
        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        gap:10px;
      }


      .side{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;

        flex-direction:row;

        flex-wrap:wrap;

        gap:12px;

        padding-top:0;
      }


      .gallery{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;
      }

    }



    @media (max-width:700px){

      .layout{
        padding-left:16px;

        padding-right:16px;
      }


      .artwork-stack{
        width:100%;
      }


      /*
        Full view becomes normal stack
        on small screens.
      */

      .artwork-stack.orbit-view{
        width:100%;

        position:static;

        display:flex;

        flex-direction:column;

        gap:var(--gap);

        min-height:0 !important;
      }


      .artwork-stack.orbit-view .tile{
        position:static;

        width:100% !important;

        left:auto !important;

        top:auto !important;
      }


      .view-toggle{
        width:100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       NAV
       ========================================================= -->

  <nav>

    <a
      href="index.html"
      data-nav>
      Home
    </a>

    <a
      href="portfolio.html"
      data-nav>
      Portfolio
    </a>

    <a
      href="about.html"
      data-nav>
      About
    </a>

  </nav>



  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div
    class="lightbox"
    id="lightbox">

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image">
      ×
    </button>

    <img
      id="lightboxImg"
      src=""
      alt="">

  </div>



  <!-- =========================================================
       PAGE
       ========================================================= -->

  <main>

    <div class="layout">


      <!-- LEFT -->

      <aside class="side">

        <a
          href="portfolio.html"
          class="current">
          Artworks
        </a>

        <a
          href="projects.html"
          data-nav>
          Projects
        </a>

        <a
          href="photography.html"
          data-nav>
          Photography
        </a>

      </aside>



      <!-- RIGHT -->

      <div class="gallery">


        <!-- ===================================================
             VIEW ICONS
             =================================================== -->

        <div class="view-toggle">


          <!-- SINGLE COLUMN -->

          <button
            class="view-btn active"
            id="singleView"
            type="button"
            aria-label="Single column view"
            title="Single column view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="7"
                y="3"
                width="10"
                height="18"
                rx="1">
              </rect>

            </svg>

          </button>



          <!-- FULL / ORBIT VIEW -->

          <button
            class="view-btn"
            id="orbitView"
            type="button"
            aria-label="Full artwork view"
            title="Full artwork view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="2"
                y="3"
                width="8"
                height="6"
                rx="1">
              </rect>

              <rect
                x="14"
                y="2"
                width="7"
                height="9"
                rx="1">
              </rect>

              <rect
                x="5"
                y="13"
                width="7"
                height="8"
                rx="1">
              </rect>

              <rect
                x="15"
                y="15"
                width="6"
                height="5"
                rx="1">
              </rect>

            </svg>

          </button>


        </div>



        <!-- ===================================================
             ARTWORK
             =================================================== -->

        <section
          class="artwork-stack"
          id="artworkGallery">

          <div class="gallery-loading">
            Loading artwork...
          </div>

        </section>


      </div>


    </div>

  </main>



  <script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const gallery =
      document.getElementById(
        "artworkGallery"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImg =
      document.getElementById(
        "lightboxImg"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    const singleView =
      document.getElementById(
        "singleView"
      );


    const orbitView =
      document.getElementById(
        "orbitView"
      );


    let artworks = [];


    let currentView =
      "single";



    /* =========================================================
       PAGE FADE
       ========================================================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add(
            "page-loaded"
          );

      }
    );



    /* =========================================================
       NAVIGATION
       ========================================================= */

    document
      .querySelectorAll(
        "a[data-nav]"
      )
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();


            document.body
              .classList
              .add(
                "page-exit"
              );


            setTimeout(
              () => {

                window.location.href =
                  link.href;

              },
              200
            );

          }
        );

      });



    /* =========================================================
       STABLE SEMI-RANDOM NUMBER
       ========================================================= */

    function seededRandom(seed){

      const value =
        Math.sin(
          seed *
          9283.493
        ) *
        43758.5453;


      return (
        value -
        Math.floor(value)
      );

    }



    /* =========================================================
       CREATE ARTWORK TILE
       ========================================================= */

    function createArtworkTile(
      artwork,
      index
    ){

      const tile =
        document.createElement(
          "div"
        );


      tile.className =
        "tile";


      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        artwork.image;


      img.alt =
        artwork.alt ||
        `Portfolio artwork ${index + 1}`;


      img.loading =
        index < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.addEventListener(
        "error",
        () => {

          console.error(
            "Missing artwork:",
            artwork.image
          );

        }
      );


      img.addEventListener(
        "click",
        () => {

          openLightbox(
            img.currentSrc ||
            img.src,
            img.alt
          );

        }
      );


      media.appendChild(
        img
      );


      tile.appendChild(
        media
      );


      return tile;

    }



    /* =========================================================
       BUILD SINGLE COLUMN
       ========================================================= */

    function buildSingleColumn(){

      currentView =
        "single";


      gallery.className =
        "artwork-stack";


      gallery.style.minHeight =
        "";


      gallery.innerHTML =
        "";


      artworks.forEach(
        (artwork,index) => {

          gallery.appendChild(
            createArtworkTile(
              artwork,
              index
            )
          );

        }
      );


      singleView
        .classList
        .add(
          "active"
        );


      orbitView
        .classList
        .remove(
          "active"
        );

    }



    /* =========================================================
       WAIT FOR IMAGES
       ========================================================= */

    function waitForImages(container){

      const images =
        [
          ...container
            .querySelectorAll(
              "img"
            )
        ];


      return Promise.all(

        images.map(img => {

          if(
            img.complete
          ){

            return Promise.resolve();

          }


          return new Promise(resolve => {

            img.addEventListener(
              "load",
              resolve,
              {
                once:true
              }
            );


            img.addEventListener(
              "error",
              resolve,
              {
                once:true
              }
            );

          });

        })

      );

    }



    /* =========================================================
       RECTANGLE COLLISION CHECK
       ========================================================= */

    function rectanglesOverlap(
      first,
      second,
      gap
    ){

      return !(
        first.x +
        first.width +
        gap <=
        second.x ||

        first.x >=
        second.x +
        second.width +
        gap ||

        first.y +
        first.height +
        gap <=
        second.y ||

        first.y >=
        second.y +
        second.height +
        gap
      );

    }



    /* =========================================================
       BUILD WIDE ORBIT VIEW
       ========================================================= */

    async function buildOrbitView(){

      currentView =
        "orbit";


      gallery.className =
        "artwork-stack orbit-view";


      gallery.innerHTML =
        "";


      gallery.style.minHeight =
        "500px";


      /*
        Mobile gets a simple stack.
      */

      if(
        window.innerWidth <= 700
      ){

        artworks.forEach(
          (artwork,index) => {

            gallery.appendChild(
              createArtworkTile(
                artwork,
                index
              )
            );

          }
        );


        orbitView
          .classList
          .add(
            "active"
          );


        singleView
          .classList
          .remove(
            "active"
          );


        return;

      }



      const tiles =
        [];


      /*
        ---------------------------------------------------------
        CREATE WORKS FIRST

        Scattered images use approximately
        22% – 32% of the gallery width.

        This allows them to spread across
        the full canvas.
        ---------------------------------------------------------
      */

      artworks.forEach(
        (artwork,index) => {

          const tile =
            createArtworkTile(
              artwork,
              index
            );


          const widthPercent =
            22 +
            seededRandom(
              index + 30
            ) *
            10;


          tile.style.width =
            widthPercent +
            "%";


          tile.style.visibility =
            "hidden";


          gallery.appendChild(
            tile
          );


          tiles.push(
            tile
          );

        }
      );



      /*
        Wait until actual image dimensions
        are available.
      */

      await waitForImages(
        gallery
      );


      if(
        currentView !==
        "orbit"
      ){

        return;

      }



      const canvasWidth =
        gallery.clientWidth;


      /*
        These horizontal anchor points
        stretch across almost the entire
        available gallery.

        They deliberately alternate around
        the center rather than forming
        recognizable columns.
      */

      const horizontalAnchors = [

        0.03,

        0.65,

        0.34,

        0.08,

        0.70,

        0.46,

        0.18,

        0.61,

        0.02,

        0.39,

        0.72,

        0.22,

        0.55,

        0.09,

        0.67,

        0.31

      ];


      const placed =
        [];


      const collisionGap =
        16;



      tiles.forEach(
        (tile,index) => {


          const tileWidth =
            tile.offsetWidth;


          const tileHeight =
            tile.offsetHeight;



          /*
            Desired horizontal position.
          */

          let desiredX =
            horizontalAnchors[
              index %
              horizontalAnchors.length
            ] *
            canvasWidth;



          /*
            Add a little stable variation
            so repeated patterns do not
            look mechanically aligned.
          */

          desiredX +=
            (
              seededRandom(
                index + 100
              ) -
              .5
            ) *
            canvasWidth *
            .08;



          /*
            Make sure the artwork remains
            inside the gallery.
          */

          desiredX =
            Math.max(
              0,
              Math.min(
                desiredX,
                canvasWidth -
                tileWidth
              )
            );



          /*
            New works begin toward the top.

            Every few works establish a
            loose vertical band, rather
            than a rigid row.
          */

          const band =
            Math.floor(
              index / 3
            );


          let desiredY =
            band *
            165;


          desiredY +=
            seededRandom(
              index + 200
            ) *
            55;



          /*
            Alternative x positions.

            If the preferred location
            collides, we'll try nearby
            positions before moving down.
          */

          const xOptions = [

            desiredX,

            canvasWidth *
            .5 -
            tileWidth /
            2,

            canvasWidth *
            .04,

            canvasWidth -
            tileWidth -
            canvasWidth *
            .04,

            canvasWidth *
            .22,

            canvasWidth *
            .58

          ].map(x =>

            Math.max(
              0,
              Math.min(
                x,
                canvasWidth -
                tileWidth
              )
            )

          );



          let found =
            false;


          let finalX =
            desiredX;


          let finalY =
            desiredY;



          /*
            Search downward in small steps.

            This guarantees no overlap,
            but keeps the artwork as close
            together as possible.
          */

          for(
            let yAttempt = 0;
            yAttempt < 120;
            yAttempt++
          ){

            const candidateY =
              desiredY +
              yAttempt *
              12;


            for(
              let xIndex = 0;
              xIndex <
              xOptions.length;
              xIndex++
            ){

              /*
                Add tiny offset to avoid
                obviously repeated anchors.
              */

              let candidateX =
                xOptions[
                  xIndex
                ];


              candidateX +=
                (
                  seededRandom(
                    index * 20 +
                    xIndex +
                    400
                  ) -
                  .5
                ) *
                18;


              candidateX =
                Math.max(
                  0,
                  Math.min(
                    candidateX,
                    canvasWidth -
                    tileWidth
                  )
                );


              const proposed =
                {
                  x:
                    candidateX,

                  y:
                    candidateY,

                  width:
                    tileWidth,

                  height:
                    tileHeight
                };


              const collision =
                placed.some(
                  existing =>

                    rectanglesOverlap(
                      proposed,
                      existing,
                      collisionGap
                    )

                );


              if(
                !collision
              ){

                finalX =
                  candidateX;


                finalY =
                  candidateY;


                found =
                  true;


                break;

              }

            }


            if(
              found
            ){

              break;

            }

          }



          /*
            Safety fallback.

            Normally the collision search
            above finds a location long
            before reaching this.
          */

          if(
            !found
          ){

            const previousBottom =
              placed.reduce(
                (
                  maximum,
                  item
                ) =>

                  Math.max(
                    maximum,
                    item.y +
                    item.height
                  ),

                0
              );


            finalX =
              desiredX;


            finalY =
              previousBottom +
              collisionGap;

          }



          tile.style.left =
            finalX +
            "px";


          tile.style.top =
            finalY +
            "px";


          tile.style.visibility =
            "visible";



          placed.push(
            {
              x:
                finalX,

              y:
                finalY,

              width:
                tileWidth,

              height:
                tileHeight
            }
          );

        }
      );



      /*
        Determine required gallery height.
      */

      const maximumBottom =
        placed.reduce(
          (
            maximum,
            item
          ) =>

            Math.max(
              maximum,
              item.y +
              item.height
            ),

          0
        );


      gallery.style.minHeight =
        (
          maximumBottom +
          30
        ) +
        "px";



      orbitView
        .classList
        .add(
          "active"
        );


      singleView
        .classList
        .remove(
          "active"
        );

    }



    /* =========================================================
       VIEW BUTTONS
       ========================================================= */

    singleView
      .addEventListener(
        "click",
        () => {

          buildSingleColumn();

        }
      );


    orbitView
      .addEventListener(
        "click",
        () => {

          buildOrbitView();

        }
      );



    /* =========================================================
       LOAD ARTWORK
       ========================================================= */

    async function loadArtworks(){

      try{

        const response =
          await fetch(
            "/content/artworks.json",
            {
              cache:
                "no-store"
            }
          );


        if(
          !response.ok
        ){

          throw new Error(
            "Could not load artworks.json"
          );

        }


        const data =
          await response.json();


        artworks =
          Array.isArray(
            data.artworks
          )
            ? data.artworks
            : [];


        if(
          artworks.length ===
          0
        ){

          gallery.innerHTML =
            `
            <div class="gallery-loading">
              No artwork yet.
            </div>
            `;


          return;

        }



        /*
          IMPORTANT:

          Artwork order is not reversed.

          With add_to_top: true in Decap:

          newest
          artwork 1
          artwork 2
          artwork 3
          ...
        */

        buildSingleColumn();

      }

      catch(error){

        console.error(
          "Artwork loading error:",
          error
        );


        gallery.innerHTML =
          `
          <div class="gallery-loading">
            Artwork could not load.
          </div>
          `;

      }

    }



    /* =========================================================
       RESPONSIVE REBUILD
       ========================================================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if(
                currentView ===
                "orbit"
              ){

                buildOrbitView();

              }

            },
            150
          );

      }
    );



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    function getScrollbarWidth(){

      return (
        window.innerWidth -
        document
          .documentElement
          .clientWidth
      );

    }



    function openLightbox(
      src,
      alt
    ){

      lightboxImg.src =
        src;


      lightboxImg.alt =
        alt || "";


      document
        .documentElement
        .style
        .setProperty(
          "--sbw",
          getScrollbarWidth() +
          "px"
        );


      document.body
        .classList
        .add(
          "lock-scroll"
        );


      lightbox
        .classList
        .add(
          "open"
        );

    }



    function closeLightbox(){

      lightbox
        .classList
        .remove(
          "open"
        );


      document.body
        .classList
        .remove(
          "lock-scroll"
        );


      setTimeout(
        () => {

          if(
            !lightbox
              .classList
              .contains(
                "open"
              )
          ){

            lightboxImg.src =
              "";

          }

        },
        240
      );

    }



    /* CLOSE */

    lightboxClose
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          closeLightbox();

        }
      );



    /* CLICK DARK BACKGROUND */

    lightbox
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            lightbox
          ){

            closeLightbox();

          }

        }
      );



    /* ESCAPE */

    window.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Escape" &&
          lightbox
            .classList
            .contains(
              "open"
            )
        ){

          closeLightbox();

        }

      }
    );



    /* =========================================================
       START
       ========================================================= */

    loadArtworks();

  </script>

</body>

</html>
