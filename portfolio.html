<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Portfolio — Jennifer Niu</title>

  <style>

    /* =========================================================
       FONT
       ========================================================= */

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root{
      --bg:#fff;
      --text:#111;
      --t:200ms;

      --gallery-width:1020px;
      --gutter:28px;

      --gap:18px;

      --links-width:190px;
    }


    *{
      box-sizing:border-box;
    }


    html{
      scrollbar-gutter:stable;
    }


    body{
      margin:0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      background:var(--bg);
      color:var(--text);

      opacity:0;

      transition:
        opacity var(--t) ease;
    }


    body.page-loaded{
      opacity:1;
    }


    body.page-exit{
      opacity:0;
    }


    body.lock-scroll{
      overflow:hidden;
      padding-right:var(--sbw,0px);
    }



    /* =========================================================
       TOP NAV
       ========================================================= */

    nav{
      position:absolute;

      top:0;
      left:0;

      width:100%;

      display:flex;
      justify-content:center;

      gap:2.2rem;

      padding:.9rem 0;

      z-index:10;
    }


    nav a{
      text-decoration:none;

      color:var(--text);

      font-size:.95rem;
      font-weight:700;

      padding:.35rem .75rem;

      border-radius:999px;

      transition:
        background 150ms,
        transform 150ms;

      user-select:none;
    }


    nav a:hover{
      background:rgba(0,0,0,.06);

      transform:translateY(-1px);
    }



    /* =========================================================
       PAGE
       ========================================================= */

    main{
      min-height:100dvh;

      padding:
        4.6rem 0 1.2rem;
    }


    .layout{
      width:100%;

      padding-left:var(--gutter);
      padding-right:var(--gutter);

      display:flex;

      justify-content:space-between;
      align-items:flex-start;

      gap:16px;
    }



    /* =========================================================
       LEFT NAV
       ========================================================= */

    .side{
      width:var(--links-width);

      flex:
        0 0 var(--links-width);

      display:flex;
      flex-direction:column;

      gap:10px;

      padding-top:2px;
    }


    .side a{
      text-decoration:none;

      color:#000;

      font-size:1.1rem;
      font-weight:700;

      letter-spacing:.15em;

      text-transform:uppercase;

      line-height:1;

      transition:
        opacity 160ms ease;

      width:fit-content;

      user-select:none;
    }


    .side a:hover{
      opacity:.55;
    }


    .side a.current{
      opacity:.35;

      pointer-events:none;
    }



    /* =========================================================
       GALLERY
       ========================================================= */

    .gallery{
      width:var(--gallery-width);

      flex:
        0 0 var(--gallery-width);
    }



    /* =========================================================
       ICON VIEW TOGGLE
       ========================================================= */

    .view-toggle{
      width:78%;

      margin:
        0 auto 14px;

      display:flex;

      justify-content:flex-end;

      gap:10px;
    }


    .view-btn{
      appearance:none;

      border:0;
      background:transparent;

      padding:3px;

      color:#111;

      cursor:pointer;

      opacity:.25;

      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }


    .view-btn:hover{
      opacity:.6;

      transform:
        translateY(-1px);
    }


    .view-btn.active{
      opacity:1;
    }


    .view-btn svg{
      width:20px;
      height:20px;

      fill:none;
      stroke:currentColor;

      stroke-width:1.6;

      stroke-linecap:round;
      stroke-linejoin:round;
    }



    /* =========================================================
       ONE-COLUMN VIEW
       ========================================================= */

    .artwork-stack{
      width:78%;

      margin:0 auto;

      display:flex;
      flex-direction:column;

      gap:var(--gap);
    }



    /* =========================================================
       SCATTERED FULL VIEW
       ========================================================= */

    .artwork-stack.scattered{
      width:100%;

      margin:0;

      position:relative;

      display:block;

      min-height:500px;
    }


    .artwork-stack.scattered .tile{
      position:absolute;

      transition:
        transform 220ms ease,
        opacity 220ms ease;
    }


    .artwork-stack.scattered .media{
      width:100%;
    }



    /* =========================================================
       ARTWORK
       ========================================================= */

    .tile{
      width:100%;

      margin:0;
    }


    .media{
      display:block;

      width:100%;

      transform:scale(1);

      transition:
        transform 220ms ease;

      will-change:transform;

      cursor:zoom-in;
    }


    .tile:hover .media{
      transform:
        scale(.985);
    }


    .media img{
      display:block;

      width:100%;

      height:auto;

      cursor:zoom-in;
    }



    /* =========================================================
       LOADING
       ========================================================= */

    .gallery-loading{
      font-size:.8rem;

      opacity:.35;

      letter-spacing:.1em;

      text-transform:uppercase;

      padding:10px;
    }



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .lightbox{
      position:fixed;

      inset:0;

      background:
        rgba(0,0,0,.85);

      display:flex;

      align-items:center;
      justify-content:center;

      opacity:0;

      pointer-events:none;

      transition:
        opacity 220ms ease;

      z-index:9999;
    }


    .lightbox.open{
      opacity:1;

      pointer-events:auto;
    }


    .lightbox img{
      max-width:90vw;

      max-height:90vh;

      width:auto;
      height:auto;

      object-fit:contain;

      transform:
        scale(.96);

      opacity:0;

      transition:
        transform 240ms
        cubic-bezier(.2,.8,.2,1),
        opacity 240ms ease;
    }


    .lightbox.open img{
      transform:
        scale(1);

      opacity:1;
    }


    .lightbox-close{
      position:absolute;

      top:20px;
      right:26px;

      font-family:
        "SpaceMono",
        monospace;

      font-size:32px;
      font-weight:400;

      background:none;
      border:none;

      color:#fff;

      cursor:pointer;

      line-height:1;

      opacity:.7;

      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }


    .lightbox-close:hover{
      opacity:1;

      transform:
        scale(1.08);
    }



    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width:1180px){

      .layout{
        flex-direction:column;

        align-items:center;
        justify-content:flex-start;

        gap:10px;
      }


      .side{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;

        flex-direction:row;

        flex-wrap:wrap;

        gap:12px;

        padding-top:0;
      }


      .gallery{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;
      }

    }


    @media (max-width:700px){

      .layout{
        padding-left:16px;
        padding-right:16px;
      }


      .artwork-stack,
      .artwork-stack.scattered{
        width:100%;
      }


      .artwork-stack.scattered{
        position:static;

        display:flex;
        flex-direction:column;

        gap:var(--gap);

        min-height:0;
      }


      .artwork-stack.scattered .tile{
        position:static;

        width:100% !important;

        transform:none !important;
      }


      .view-toggle{
        width:100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       TOP NAV
       ========================================================= -->

  <nav>

    <a
      href="index.html"
      data-nav>
      Home
    </a>

    <a
      href="portfolio.html"
      data-nav>
      Portfolio
    </a>

    <a
      href="about.html"
      data-nav>
      About
    </a>

  </nav>



  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div
    class="lightbox"
    id="lightbox">

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image">
      ×
    </button>

    <img
      id="lightboxImg"
      src=""
      alt="">

  </div>



  <!-- =========================================================
       PAGE
       ========================================================= -->

  <main>

    <div class="layout">


      <!-- LEFT -->

      <aside class="side">

        <a
          href="portfolio.html"
          class="current">
          Artworks
        </a>

        <a
          href="projects.html"
          data-nav>
          Projects
        </a>

        <a
          href="photography.html"
          data-nav>
          Photography
        </a>

      </aside>



      <!-- RIGHT -->

      <div class="gallery">


        <!-- VIEW TOGGLE -->

        <div class="view-toggle">


          <!-- SINGLE COLUMN ICON -->

          <button
            class="view-btn active"
            id="singleView"
            type="button"
            aria-label="Single column view"
            title="Single column view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="7"
                y="3"
                width="10"
                height="18"
                rx="1">
              </rect>

            </svg>

          </button>



          <!-- SCATTERED VIEW ICON -->

          <button
            class="view-btn"
            id="fullView"
            type="button"
            aria-label="Scattered full view"
            title="Scattered full view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="2"
                y="3"
                width="8"
                height="6"
                rx="1">
              </rect>

              <rect
                x="14"
                y="2"
                width="7"
                height="9"
                rx="1">
              </rect>

              <rect
                x="5"
                y="13"
                width="7"
                height="8"
                rx="1">
              </rect>

              <rect
                x="15"
                y="15"
                width="6"
                height="5"
                rx="1">
              </rect>

            </svg>

          </button>


        </div>



        <!-- ARTWORK -->

        <section
          class="artwork-stack"
          id="artworkGallery">

          <div class="gallery-loading">
            Loading artwork...
          </div>

        </section>


      </div>


    </div>

  </main>



  <script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const gallery =
      document.getElementById(
        "artworkGallery"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImg =
      document.getElementById(
        "lightboxImg"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    const singleView =
      document.getElementById(
        "singleView"
      );


    const fullView =
      document.getElementById(
        "fullView"
      );


    let artworks = [];

    let currentView =
      "single";



    /* =========================================================
       PAGE FADE
       ========================================================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add(
            "page-loaded"
          );

      }
    );



    /* =========================================================
       NAVIGATION
       ========================================================= */

    document
      .querySelectorAll(
        "a[data-nav]"
      )
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();


            document.body
              .classList
              .add(
                "page-exit"
              );


            setTimeout(
              () => {

                window.location.href =
                  link.href;

              },
              200
            );

          }
        );

      });



    /* =========================================================
       SEEDED RANDOM
       ========================================================= */

    function seededRandom(seed){

      const x =
        Math.sin(seed * 999) *
        43758.5453123;


      return (
        x -
        Math.floor(x)
      );

    }



    /* =========================================================
       CREATE TILE
       ========================================================= */

    function createArtworkTile(
      artwork,
      index
    ){

      const tile =
        document.createElement(
          "div"
        );


      tile.className =
        "tile";


      tile.dataset.index =
        index;


      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        artwork.image;


      img.alt =
        artwork.alt ||
        `Portfolio artwork ${index + 1}`;


      img.loading =
        index < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.addEventListener(
        "error",
        () => {

          console.error(
            "Missing artwork:",
            artwork.image
          );

        }
      );


      img.addEventListener(
        "click",
        () => {

          openLightbox(
            img.currentSrc ||
            img.src,
            img.alt
          );

        }
      );


      media.appendChild(
        img
      );


      tile.appendChild(
        media
      );


      return tile;

    }



    /* =========================================================
       SINGLE COLUMN
       ========================================================= */

    function buildSingleColumn(){

      currentView =
        "single";


      gallery.className =
        "artwork-stack";


      gallery.innerHTML =
        "";


      artworks.forEach(
        (artwork,index) => {

          gallery.appendChild(
            createArtworkTile(
              artwork,
              index
            )
          );

        }
      );


      singleView
        .classList
        .add(
          "active"
        );


      fullView
        .classList
        .remove(
          "active"
        );

    }



    /* =========================================================
       SCATTERED VIEW
       ========================================================= */

    function buildScatteredView(){

      currentView =
        "scattered";


      gallery.className =
        "artwork-stack scattered";


      gallery.innerHTML =
        "";


      /*
        If we're on mobile, just use
        normal vertical stacking.
      */

      if(
        window.innerWidth <= 700
      ){

        artworks.forEach(
          (artwork,index) => {

            gallery.appendChild(
              createArtworkTile(
                artwork,
                index
              )
            );

          }
        );


        fullView.classList.add(
          "active"
        );


        singleView.classList.remove(
          "active"
        );


        return;

      }



      const galleryWidth =
        gallery.clientWidth;


      /*
        Vertical cursor tracks how far
        down the page we've placed work.

        We place artworks in loose bands.
      */

      let yCursor =
        0;


      const tiles =
        [];


      artworks.forEach(
        (artwork,index) => {


          const tile =
            createArtworkTile(
              artwork,
              index
            );


          /*
            Stable semi-random width:

            about 24% - 40%
          */

          const widthPercent =
            24 +
            seededRandom(
              index + 10
            ) * 16;


          /*
            Stable horizontal offset.

            Keep enough room so the
            artwork stays inside gallery.
          */

          const maxLeft =
            100 -
            widthPercent;


          const leftPercent =
            seededRandom(
              index + 50
            ) *
            maxLeft;


          /*
            Extra vertical breathing room.
          */

          const extraTop =
            20 +
            seededRandom(
              index + 90
            ) * 65;


          tile.style.width =
            widthPercent +
            "%";


          tile.style.left =
            leftPercent +
            "%";


          tile.style.top =
            yCursor +
            extraTop +
            "px";


          gallery.appendChild(
            tile
          );


          tiles.push(
            tile
          );


          /*
            Move the next band downward.

            This is intentionally generous
            enough to avoid overlaps.
          */

          yCursor +=
            180 +
            seededRandom(
              index + 150
            ) * 140;

        }
      );



      /*
        Wait for images to load so we can
        calculate the true required height.
      */

      requestAnimationFrame(
        () => {

          setTimeout(
            () => {

              let bottom =
                0;


              tiles.forEach(
                tile => {

                  const tileBottom =
                    tile.offsetTop +
                    tile.offsetHeight;


                  if(
                    tileBottom >
                    bottom
                  ){

                    bottom =
                      tileBottom;

                  }

                }
              );


              gallery.style.minHeight =
                bottom +
                40 +
                "px";

            },
            100
          );

        }
      );


      fullView
        .classList
        .add(
          "active"
        );


      singleView
        .classList
        .remove(
          "active"
        );

    }



    /* =========================================================
       VIEW BUTTONS
       ========================================================= */

    singleView
      .addEventListener(
        "click",
        () => {

          buildSingleColumn();

        }
      );


    fullView
      .addEventListener(
        "click",
        () => {

          buildScatteredView();

        }
      );



    /* =========================================================
       LOAD ARTWORK
       ========================================================= */

    async function loadArtworks(){

      try{

        const response =
          await fetch(
            "/content/artworks.json",
            {
              cache:"no-store"
            }
          );


        if(
          !response.ok
        ){

          throw new Error(
            "Could not load artworks.json"
          );

        }


        const data =
          await response.json();


        artworks =
          Array.isArray(
            data.artworks
          )
            ? data.artworks
            : [];


        if(
          artworks.length === 0
        ){

          gallery.innerHTML =
            `
            <div class="gallery-loading">
              No artwork yet.
            </div>
            `;

          return;

        }


        /*
          Default view is always
          single-column.
        */

        buildSingleColumn();

      }

      catch(error){

        console.error(
          "Artwork loading error:",
          error
        );


        gallery.innerHTML =
          `
          <div class="gallery-loading">
            Artwork could not load.
          </div>
          `;

      }

    }



    /* =========================================================
       RESIZE
       ========================================================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if(
                currentView ===
                "scattered"
              ){

                buildScatteredView();

              }

            },
            120
          );

      }
    );



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    function getScrollbarWidth(){

      return (
        window.innerWidth -
        document
          .documentElement
          .clientWidth
      );

    }



    function openLightbox(
      src,
      alt
    ){

      lightboxImg.src =
        src;


      lightboxImg.alt =
        alt || "";


      document
        .documentElement
        .style
        .setProperty(
          "--sbw",
          getScrollbarWidth() +
          "px"
        );


      document.body
        .classList
        .add(
          "lock-scroll"
        );


      lightbox
        .classList
        .add(
          "open"
        );

    }



    function closeLightbox(){

      lightbox
        .classList
        .remove(
          "open"
        );


      document.body
        .classList
        .remove(
          "lock-scroll"
        );


      setTimeout(
        () => {

          if(
            !lightbox
              .classList
              .contains(
                "open"
              )
          ){

            lightboxImg.src =
              "";

          }

        },
        240
      );

    }



    lightboxClose
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          closeLightbox();

        }
      );


    lightbox
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            lightbox
          ){

            closeLightbox();

          }

        }
      );


    window.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Escape" &&
          lightbox
            .classList
            .contains(
              "open"
            )
        ){

          closeLightbox();

        }

      }
    );



    /* =========================================================
       START
       ========================================================= */

    loadArtworks();

  </script>

</body>

</html>
