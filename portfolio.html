<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Portfolio — Jennifer Niu</title>

  <style>

    /* =========================================================
       FONT
       ========================================================= */

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root{
      --bg:#fff;
      --text:#111;

      --t:200ms;

      --gallery-width:1020px;

      --gutter:28px;

      --gap:18px;

      --links-width:190px;
    }


    *{
      box-sizing:border-box;
    }


    html{
      scrollbar-gutter:stable;
    }


    body{
      margin:0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      background:var(--bg);

      color:var(--text);

      opacity:0;

      transition:
        opacity var(--t) ease;
    }


    body.page-loaded{
      opacity:1;
    }


    body.page-exit{
      opacity:0;
    }


    body.lock-scroll{
      overflow:hidden;

      padding-right:
        var(--sbw,0px);
    }



    /* =========================================================
       TOP NAV
       ========================================================= */

    nav{
      position:absolute;

      top:0;
      left:0;

      width:100%;

      display:flex;

      justify-content:center;

      gap:2.2rem;

      padding:.9rem 0;

      z-index:10;
    }


    nav a{
      text-decoration:none;

      color:var(--text);

      font-size:.95rem;

      font-weight:700;

      padding:.35rem .75rem;

      border-radius:999px;

      transition:
        background 150ms ease,
        transform 150ms ease;

      user-select:none;
    }


    nav a:hover{
      background:rgba(0,0,0,.06);

      transform:
        translateY(-1px);
    }



    /* =========================================================
       PAGE
       ========================================================= */

    main{
      min-height:100dvh;

      padding:
        4.6rem 0 1.2rem;
    }


    .layout{
      width:100%;

      padding-left:
        var(--gutter);

      padding-right:
        var(--gutter);

      display:flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:16px;
    }



    /* =========================================================
       LEFT NAV
       ========================================================= */

    .side{
      width:
        var(--links-width);

      flex:
        0 0 var(--links-width);

      display:flex;

      flex-direction:
        column;

      gap:10px;

      padding-top:2px;
    }


    .side a{
      text-decoration:none;

      color:#000;

      font-size:1.1rem;

      font-weight:700;

      letter-spacing:.15em;

      text-transform:
        uppercase;

      line-height:1;

      transition:
        opacity 160ms ease;

      width:fit-content;

      user-select:none;
    }


    .side a:hover{
      opacity:.55;
    }


    .side a.current{
      opacity:.35;

      pointer-events:none;
    }



    /* =========================================================
       GALLERY
       ========================================================= */

    .gallery{
      width:
        var(--gallery-width);

      flex:
        0 0 var(--gallery-width);
    }



    /* =========================================================
       VIEW TOGGLE
       ========================================================= */

    .view-toggle{
      width:78%;

      margin:
        0 auto 14px;

      display:flex;

      justify-content:flex-end;

      gap:10px;
    }


    .view-btn{
      appearance:none;

      border:0;

      background:transparent;

      padding:3px;

      color:#111;

      cursor:pointer;

      opacity:.25;

      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }


    .view-btn:hover{
      opacity:.6;

      transform:
        translateY(-1px);
    }


    .view-btn.active{
      opacity:1;
    }


    .view-btn svg{
      width:20px;
      height:20px;

      fill:none;

      stroke:currentColor;

      stroke-width:1.6;

      stroke-linecap:round;

      stroke-linejoin:round;
    }



    /* =========================================================
       DEFAULT SINGLE COLUMN
       ========================================================= */

    .artwork-stack{
      width:78%;

      margin:0 auto;

      display:flex;

      flex-direction:column;

      gap:var(--gap);
    }



    /* =========================================================
       COLLAGE VIEW
       ========================================================= */

    .artwork-stack.collage-view{
      width:100%;

      margin:0;

      display:block;

      position:relative;

      min-height:500px;
    }


    .artwork-stack.collage-view .tile{
      position:absolute;

      margin:0;
    }



    /* =========================================================
       FULL-SCREEN COLLAGE MODE

       IMPORTANT:
       THESE RULES ONLY APPLY WHEN COLLAGE MODE IS ACTIVE.
       SINGLE COLUMN IS NOT CHANGED.
       ========================================================= */

    body.collage-mode .layout{
      display:block;

      padding-left:0;
      padding-right:0;
    }


    body.collage-mode .side{
      display:none;
    }


    body.collage-mode .gallery{
      width:100%;

      max-width:none;

      flex:none;
    }


    body.collage-mode .view-toggle{
      width:100%;

      margin:
        0 0 14px;

      padding:
        0 28px;

      justify-content:flex-end;
    }


    body.collage-mode .artwork-stack.collage-view{
      width:100%;

      margin:0;

      padding-left:28px;
      padding-right:28px;
    }



    /* =========================================================
       ARTWORK
       ========================================================= */

    .tile{
      width:100%;

      margin:0;
    }


    .media{
      display:block;

      width:100%;

      transform:scale(1);

      transition:
        transform 260ms cubic-bezier(.2,.8,.2,1);
      
      transform-origin:center center;
      
      will-change:transform;

      cursor:zoom-in;
    }


    .tile:hover .media{
      transform:
        scale(.96);
    }


    .media img{
      display:block;

      width:100%;

      height:auto;

      cursor:zoom-in;
    }



    /* =========================================================
       LOADING / ERROR
       ========================================================= */

    .gallery-loading{
      font-size:.8rem;

      opacity:.35;

      letter-spacing:.1em;

      text-transform:uppercase;

      padding:10px;
    }



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .lightbox{
      position:fixed;

      inset:0;

      background:
        rgba(0,0,0,.85);

      display:flex;

      align-items:center;

      justify-content:center;

      opacity:0;

      pointer-events:none;

      transition:
        opacity 220ms ease;

      z-index:9999;
    }


    .lightbox.open{
      opacity:1;

      pointer-events:auto;
    }


    .lightbox img{
      max-width:90vw;

      max-height:90vh;

      width:auto;

      height:auto;

      object-fit:contain;

      transform:
        scale(.96);

      opacity:0;

      transition:
        transform 240ms
        cubic-bezier(.2,.8,.2,1),
        opacity 240ms ease;
    }


    .lightbox.open img{
      transform:
        scale(1);

      opacity:1;
    }


    .lightbox-close{
      position:absolute;

      top:20px;

      right:26px;

      font-family:
        "SpaceMono",
        monospace;

      font-size:32px;

      font-weight:400;

      background:none;

      border:none;

      color:white;

      cursor:pointer;

      line-height:1;

      opacity:.7;

      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }


    .lightbox-close:hover{
      opacity:1;

      transform:
        scale(1.08);
    }



    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width:1180px){

      .layout{
        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        gap:10px;
      }


      .side{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;

        flex-direction:row;

        flex-wrap:wrap;

        gap:12px;

        padding-top:0;
      }


      .gallery{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;
      }


      /*
        Collage mode still overrides the
        standard responsive layout.
      */

      body.collage-mode .layout{
        display:block;

        padding-left:0;
        padding-right:0;
      }


      body.collage-mode .gallery{
        width:100%;
      }

    }



    @media (max-width:700px){

      .layout{
        padding-left:16px;

        padding-right:16px;
      }


      .artwork-stack{
        width:100%;
      }


      /*
        On mobile, collage falls back
        to a normal vertical stack.
      */

      .artwork-stack.collage-view{
        width:100%;

        display:flex;

        flex-direction:column;

        gap:var(--gap);

        position:static;

        min-height:0 !important;
      }


      .artwork-stack.collage-view .tile{
        position:static;

        width:100% !important;

        left:auto !important;

        top:auto !important;
      }


      .view-toggle{
        width:100%;
      }


      body.collage-mode .artwork-stack.collage-view{
        padding-left:16px;
        padding-right:16px;
      }


      body.collage-mode .view-toggle{
        padding-left:16px;
        padding-right:16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       NAV
       ========================================================= -->

  <nav>

    <a
      href="index.html"
      data-nav>
      Home
    </a>

    <a
      href="portfolio.html"
      data-nav>
      Portfolio
    </a>

    <a
      href="about.html"
      data-nav>
      About
    </a>

  </nav>



  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div
    class="lightbox"
    id="lightbox">

    <button
      class="lightbox-close"
      id="lightboxClose"
      type="button"
      aria-label="Close image">
      ×
    </button>

    <img
      id="lightboxImg"
      src=""
      alt="">

  </div>



  <!-- =========================================================
       PAGE
       ========================================================= -->

  <main>

    <div class="layout">


      <!-- LEFT -->

      <aside class="side">

        <a
          href="portfolio.html"
          class="current">
          Artworks
        </a>

        <a
          href="projects.html"
          data-nav>
          Projects
        </a>

        <a
          href="photography.html"
          data-nav>
          Photography
        </a>

      </aside>



      <!-- RIGHT -->

      <div class="gallery">


        <!-- ===================================================
             VIEW ICONS
             =================================================== -->

        <div class="view-toggle">


          <!-- SINGLE COLUMN -->

          <button
            class="view-btn active"
            id="singleView"
            type="button"
            aria-label="Single column view"
            title="Single column view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="7"
                y="3"
                width="10"
                height="18"
                rx="1">
              </rect>

            </svg>

          </button>



          <!-- COLLAGE -->

          <button
            class="view-btn"
            id="collageView"
            type="button"
            aria-label="Collage view"
            title="Collage view">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true">

              <rect
                x="2"
                y="3"
                width="8"
                height="6"
                rx="1">
              </rect>

              <rect
                x="14"
                y="2"
                width="7"
                height="9"
                rx="1">
              </rect>

              <rect
                x="5"
                y="13"
                width="7"
                height="8"
                rx="1">
              </rect>

              <rect
                x="15"
                y="15"
                width="6"
                height="5"
                rx="1">
              </rect>

            </svg>

          </button>


        </div>



        <!-- ===================================================
             ARTWORK
             =================================================== -->

        <section
          class="artwork-stack"
          id="artworkGallery">

          <div class="gallery-loading">
            Loading artwork...
          </div>

        </section>


      </div>


    </div>

  </main>



  <script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const gallery =
      document.getElementById(
        "artworkGallery"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImg =
      document.getElementById(
        "lightboxImg"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    const singleView =
      document.getElementById(
        "singleView"
      );


    const collageView =
      document.getElementById(
        "collageView"
      );


    let artworks =
      [];


    let collageLayout =
      [];


    let currentView =
      "single";



    /* =========================================================
       PAGE FADE
       ========================================================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add(
            "page-loaded"
          );

      }
    );



    /* =========================================================
       NAVIGATION
       ========================================================= */

    document
      .querySelectorAll(
        "a[data-nav]"
      )
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();


            document.body
              .classList
              .add(
                "page-exit"
              );


            setTimeout(
              () => {

                window.location.href =
                  link.href;

              },
              200
            );

          }
        );

      });



    /* =========================================================
       CREATE ARTWORK TILE
       ========================================================= */

    function createArtworkTile(
      artwork,
      index
    ){

      const tile =
        document.createElement(
          "div"
        );


      tile.className =
        "tile";


      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        artwork.image;


      img.alt =
        artwork.alt ||
        `Portfolio artwork ${index + 1}`;


      img.loading =
        index < 3
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.addEventListener(
        "error",
        () => {

          console.error(
            "Missing artwork:",
            artwork.image
          );

        }
      );


      img.addEventListener(
        "click",
        () => {

          openLightbox(
            img.currentSrc ||
            img.src,
            img.alt
          );

        }
      );


      media.appendChild(
        img
      );


      tile.appendChild(
        media
      );


      return tile;

    }



    /* =========================================================
       SINGLE COLUMN

       IMPORTANT:
       THIS IS THE SAME SINGLE-COLUMN LAYOUT.
       ========================================================= */

    function buildSingleColumn(){

      currentView =
        "single";


      /*
        Remove full-screen collage mode.
      */

      document.body
        .classList
        .remove(
          "collage-mode"
        );


      gallery.className =
        "artwork-stack";


      gallery.style.minHeight =
        "";


      gallery.innerHTML =
        "";


      artworks.forEach(
        (artwork,index) => {

          gallery.appendChild(
            createArtworkTile(
              artwork,
              index
            )
          );

        }
      );


      singleView
        .classList
        .add(
          "active"
        );


      collageView
        .classList
        .remove(
          "active"
        );

    }



    /* =========================================================
       COLLAGE VIEW
       ========================================================= */

    function buildCollageView(){

      currentView =
        "collage";


      /*
        THIS is the only thing that expands
        the layout to full screen.
      */

      document.body
        .classList
        .add(
          "collage-mode"
        );


      gallery.className =
        "artwork-stack collage-view";


      gallery.innerHTML =
        "";


      /*
        MOBILE
      */

      if(
        window.innerWidth <= 700
      ){

        artworks.forEach(
          (artwork,index) => {

            gallery.appendChild(
              createArtworkTile(
                artwork,
                index
              )
            );

          }
        );


        gallery.style.minHeight =
          "";


        collageView
          .classList
          .add(
            "active"
          );


        singleView
          .classList
          .remove(
            "active"
          );


        return;

      }



      /*
        CONNECT ARTWORK IMAGE PATHS
        TO COLLAGE POSITIONS
      */

      const artworkByImage =
        {};


      artworks.forEach(
        artwork => {

          if(
            artwork &&
            artwork.image
          ){

            artworkByImage[
              artwork.image
            ] =
              artwork;

          }

        }
      );



      /*
        NO COLLAGE SAVED
      */

      if(
        !Array.isArray(
          collageLayout
        ) ||
        collageLayout.length ===
        0
      ){

        gallery.innerHTML =
          `
          <div class="gallery-loading">
            Collage layout has not been published yet.
          </div>
          `;


        gallery.style.minHeight =
          "200px";


        collageView
          .classList
          .add(
            "active"
          );


        singleView
          .classList
          .remove(
            "active"
          );


        return;

      }



      let maximumBottom =
        0;



      /*
        IMPORTANT:

        x and width are percentages.

        Because your public collage is now
        wider than the admin canvas, the
        entire composition scales horizontally
        to fill the screen.

        y remains in pixels.
      */

      collageLayout.forEach(
        (item,index) => {


          if(
            !item ||
            !item.image
          ){

            return;

          }


          const artwork =
            artworkByImage[
              item.image
            ];


          /*
            Ignore deleted artwork.
          */

          if(
            !artwork
          ){

            return;

          }


          const tile =
            createArtworkTile(
              artwork,
              index
            );


          const x =
            Number(
              item.x
            ) || 0;


          const y =
            Number(
              item.y
            ) || 0;


          const width =
            Number(
              item.width
            ) || 26;



          tile.style.left =
            x +
            "%";


          tile.style.top =
            y +
            "px";


          tile.style.width =
            width +
            "%";


          gallery.appendChild(
            tile
          );



          /*
            UPDATE COLLAGE HEIGHT
          */

          const img =
            tile.querySelector(
              "img"
            );


          const updateHeight =
            () => {

              const bottom =
                tile.offsetTop +
                tile.offsetHeight;


              maximumBottom =
                Math.max(
                  maximumBottom,
                  bottom
                );


              gallery.style.minHeight =
                (
                  maximumBottom +
                  50
                ) +
                "px";

            };


          if(
            img.complete
          ){

            updateHeight();

          }
          else{

            img.addEventListener(
              "load",
              updateHeight,
              {
                once:true
              }
            );


            img.addEventListener(
              "error",
              updateHeight,
              {
                once:true
              }
            );

          }

        }
      );



      collageView
        .classList
        .add(
          "active"
        );


      singleView
        .classList
        .remove(
          "active"
        );

    }



    /* =========================================================
       VIEW BUTTONS
       ========================================================= */

    singleView
      .addEventListener(
        "click",
        () => {

          buildSingleColumn();

        }
      );


    collageView
      .addEventListener(
        "click",
        () => {

          buildCollageView();

        }
      );



    /* =========================================================
       LOAD ARTWORKS + COLLAGE
       ========================================================= */

    async function loadPortfolioData(){

      try{

        const [
          artworkResponse,
          collageResponse
        ] =
          await Promise.all([


            fetch(
              "/content/artworks.json?v=" +
              Date.now(),
              {
                cache:
                  "no-store"
              }
            ),


            fetch(
              "/content/collage.json?v=" +
              Date.now(),
              {
                cache:
                  "no-store"
              }
            )


          ]);



        if(
          !artworkResponse.ok
        ){

          throw new Error(
            "Could not load artworks.json"
          );

        }


        if(
          !collageResponse.ok
        ){

          throw new Error(
            "Could not load collage.json"
          );

        }



        const artworkData =
          await artworkResponse.json();


        const collageData =
          await collageResponse.json();



        artworks =
          Array.isArray(
            artworkData.artworks
          )
            ? artworkData.artworks
            : [];


        collageLayout =
          Array.isArray(
            collageData.layout
          )
            ? collageData.layout
            : [];



        /*
          ALWAYS START WITH THE EXISTING
          SINGLE COLUMN VIEW.
        */

        buildSingleColumn();

      }

      catch(error){

        console.error(
          "Portfolio loading error:",
          error
        );


        gallery.innerHTML =
          `
          <div class="gallery-loading">
            Portfolio could not load.
          </div>
          `;

      }

    }



    /* =========================================================
       RESIZE
       ========================================================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if(
                currentView ===
                "collage"
              ){

                buildCollageView();

              }

            },
            150
          );

      }
    );



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    function getScrollbarWidth(){

      return (
        window.innerWidth -
        document
          .documentElement
          .clientWidth
      );

    }



    function openLightbox(
      src,
      alt
    ){

      lightboxImg.src =
        src;


      lightboxImg.alt =
        alt || "";


      document
        .documentElement
        .style
        .setProperty(
          "--sbw",
          getScrollbarWidth() +
          "px"
        );


      document.body
        .classList
        .add(
          "lock-scroll"
        );


      lightbox
        .classList
        .add(
          "open"
        );

    }



    function closeLightbox(){

      lightbox
        .classList
        .remove(
          "open"
        );


      document.body
        .classList
        .remove(
          "lock-scroll"
        );


      setTimeout(
        () => {

          if(
            !lightbox
              .classList
              .contains(
                "open"
              )
          ){

            lightboxImg.src =
              "";

          }

        },
        240
      );

    }



    /* CLOSE */

    lightboxClose
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          closeLightbox();

        }
      );



    /* CLICK BACKGROUND */

    lightbox
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            lightbox
          ){

            closeLightbox();

          }

        }
      );



    /* ESCAPE */

    window.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Escape" &&
          lightbox
            .classList
            .contains(
              "open"
            )
        ){

          closeLightbox();

        }

      }
    );



    /* =========================================================
       START
       ========================================================= */

    loadPortfolioData();

  </script>
