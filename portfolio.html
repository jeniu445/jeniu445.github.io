<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Portfolio — Jennifer Niu</title>

  <style>

    /* =========================================================
       FONT
       ========================================================= */

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }

    @font-face{
      font-family:"SpaceMono";
      src:url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root{
      --bg:#fff;
      --text:#111;
      --t:200ms;

      --gallery-width:1020px;
      --gutter:28px;

      /* Space between artworks */
      --gap:14px;

      --links-width:190px;
    }


    *{
      box-sizing:border-box;
    }


    html{
      scrollbar-gutter:stable;
    }


    body{
      margin:0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      background:var(--bg);
      color:var(--text);

      opacity:0;

      transition:
        opacity var(--t) ease;
    }


    body.page-loaded{
      opacity:1;
    }


    body.page-exit{
      opacity:0;
    }


    body.lock-scroll{
      overflow:hidden;
      padding-right:var(--sbw,0px);
    }



    /* =========================================================
       TOP NAVIGATION
       ========================================================= */

    nav{
      position:absolute;

      top:0;
      left:0;

      width:100%;

      display:flex;
      justify-content:center;

      gap:2.2rem;

      padding:.9rem 0;

      z-index:10;
    }


    nav a{
      text-decoration:none;

      color:var(--text);

      font-size:.95rem;
      font-weight:700;

      padding:.35rem .75rem;

      border-radius:999px;

      transition:
        background 150ms,
        transform 150ms,
        opacity 150ms;

      user-select:none;
    }


    nav a:hover{
      background:rgba(0,0,0,.06);

      transform:
        translateY(-1px);
    }



    /* =========================================================
       PAGE
       ========================================================= */

    main{
      min-height:100dvh;

      padding:
        4.6rem 0 1.2rem;
    }


    .layout{
      width:100%;

      padding-left:var(--gutter);
      padding-right:var(--gutter);

      display:flex;

      justify-content:space-between;
      align-items:flex-start;

      gap:16px;
    }



    /* =========================================================
       LEFT NAVIGATION
       ========================================================= */

    .side{
      width:var(--links-width);

      flex:
        0 0 var(--links-width);

      display:flex;
      flex-direction:column;

      gap:10px;

      padding-top:2px;
    }


    .side a{
      text-decoration:none;

      color:#000;

      font-size:1.1rem;
      font-weight:700;

      letter-spacing:.15em;

      text-transform:uppercase;

      line-height:1;

      transition:
        opacity 160ms ease;

      width:fit-content;

      user-select:none;
    }


    .side a:hover{
      opacity:.55;
    }


    .side a.current{
      opacity:.35;

      pointer-events:none;
    }



    /* =========================================================
       GALLERY CONTAINER
       ========================================================= */

    .gallery{
      width:var(--gallery-width);

      flex:
        0 0 var(--gallery-width);
    }



    /* =========================================================
       VIEW TOGGLE
       ========================================================= */

    .view-toggle{
      width:78%;

      margin:
        0 auto 10px;

      display:flex;

      justify-content:flex-end;

      align-items:center;

      gap:12px;
    }


    .view-btn{
      appearance:none;

      border:0;

      background:transparent;

      padding:4px 0;

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      font-size:.68rem;

      font-weight:700;

      letter-spacing:.08em;

      text-transform:uppercase;

      color:#111;

      cursor:pointer;

      opacity:.3;

      transition:
        opacity 150ms ease;
    }


    .view-btn:hover{
      opacity:.65;
    }


    .view-btn.active{
      opacity:1;
    }



    /* =========================================================
       DEFAULT VIEW:
       ONE VERTICAL COLUMN
       ========================================================= */

    .artwork-stack{

      /*
        78% keeps the single-column artwork
        from feeling too large.

        Change this to:
        85% = larger
        70% = smaller
      */

      width:78%;

      margin:0 auto;

      display:flex;

      flex-direction:column;

      gap:var(--gap);

      padding:
        0 0 var(--gap);
    }



    /* =========================================================
       THREE-COLUMN VIEW
       ========================================================= */

    .artwork-stack.three-column{
      width:100%;

      display:grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:var(--gap);

      align-items:start;
    }


    .artwork-stack.three-column .tile{
      width:100%;
    }



    /* =========================================================
       ARTWORK
       ========================================================= */

    .tile{
      width:100%;

      margin:0;
    }


    .media{
      display:block;

      width:100%;

      transform:
        scale(1);

      transition:
        transform 220ms ease;

      will-change:transform;

      cursor:zoom-in;
    }


    .tile:hover .media{
      transform:
        scale(.985);
    }


    .media img{
      display:block;

      width:100%;
      height:auto;

      cursor:zoom-in;
    }



    /* =========================================================
       LOADING MESSAGE
       ========================================================= */

    .gallery-loading{
      font-size:.8rem;

      opacity:.35;

      letter-spacing:.1em;

      text-transform:uppercase;

      padding:10px;
    }



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .lightbox{
      position:fixed;

      inset:0;

      background:
        rgba(0,0,0,.85);

      display:flex;

      align-items:center;
      justify-content:center;

      opacity:0;

      pointer-events:none;

      transition:
        opacity 220ms ease;

      z-index:9999;
    }


    .lightbox.open{
      opacity:1;

      pointer-events:auto;
    }


    .lightbox img{
      max-width:90vw;

      max-height:90vh;

      width:auto;

      height:auto;

      object-fit:contain;

      transform:
        scale(.96);

      opacity:0;

      transition:
        transform 240ms
        cubic-bezier(.2,.8,.2,1),
        opacity 240ms ease;

      will-change:
        transform,
        opacity;
    }


    .lightbox.open img{
      transform:
        scale(1);

      opacity:1;
    }


    .lightbox-close{
      position:absolute;

      top:20px;

      right:26px;

      font-family:
        "SpaceMono",
        monospace;

      font-size:32px;

      font-weight:400;

      background:none;

      border:none;

      color:white;

      cursor:pointer;

      line-height:1;

      opacity:.7;

      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }


    .lightbox-close:hover{
      opacity:1;

      transform:
        scale(1.08);
    }



    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width:1180px){

      .layout{
        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        gap:10px;
      }


      .side{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;

        flex-direction:row;

        flex-wrap:wrap;

        gap:12px;

        padding-top:0;
      }


      .gallery{
        width:
          min(
            100%,
            var(--gallery-width)
          );

        flex:
          0 1 auto;
      }

    }



    /* =========================================================
       SMALL TABLET
       ========================================================= */

    @media (max-width:800px){

      /*
        On smaller screens, the "3 column"
        option becomes 2 columns so the
        artwork doesn't get too tiny.
      */

      .artwork-stack.three-column{
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }

    }



    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width:600px){

      .layout{
        padding-left:16px;

        padding-right:16px;
      }


      /*
        Single-column mode fills the available
        mobile width.
      */

      .artwork-stack{
        width:100%;
      }


      /*
        Even if 3-column mode was selected,
        mobile becomes one column.
      */

      .artwork-stack.three-column{
        width:100%;

        display:flex;

        flex-direction:column;
      }


      .view-toggle{
        width:100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       TOP NAVIGATION
       ========================================================= -->

  <nav>

    <a
      href="index.html"
      data-nav>
      Home
    </a>

    <a
      href="portfolio.html"
      data-nav>
      Portfolio
    </a>

    <a
      href="about.html"
      data-nav>
      About
    </a>

  </nav>



  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div
    class="lightbox"
    id="lightbox">

    <button
      class="lightbox-close"
      id="lightboxClose"
      aria-label="Close image"
      type="button">
      ×
    </button>

    <img
      id="lightboxImg"
      src=""
      alt="">

  </div>



  <!-- =========================================================
       PAGE
       ========================================================= -->

  <main>

    <div class="layout">


      <!-- =====================================================
           LEFT NAVIGATION
           ===================================================== -->

      <aside class="side">

        <a
          href="portfolio.html"
          class="current">
          Artworks
        </a>

        <a
          href="projects.html"
          data-nav>
          Projects
        </a>

        <a
          href="photography.html"
          data-nav>
          Photography
        </a>

      </aside>



      <!-- =====================================================
           GALLERY
           ===================================================== -->

      <div class="gallery">


        <!-- VIEW OPTIONS -->

        <div class="view-toggle">

          <button
            class="view-btn active"
            id="singleView"
            type="button">
            1 Column
          </button>


          <button
            class="view-btn"
            id="gridView"
            type="button">
            3 Columns
          </button>

        </div>



        <!-- ARTWORK -->

        <section
          class="artwork-stack"
          id="artworkGallery">

          <div class="gallery-loading">
            Loading artwork...
          </div>

        </section>


      </div>


    </div>

  </main>



  <script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const gallery =
      document.getElementById(
        "artworkGallery"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImg =
      document.getElementById(
        "lightboxImg"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    const singleView =
      document.getElementById(
        "singleView"
      );


    const gridView =
      document.getElementById(
        "gridView"
      );



    /* =========================================================
       PAGE FADE
       ========================================================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add(
            "page-loaded"
          );

      }
    );



    /* =========================================================
       NAVIGATION FADE
       ========================================================= */

    document
      .querySelectorAll(
        "a[data-nav]"
      )
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();


            document.body
              .classList
              .add(
                "page-exit"
              );


            setTimeout(
              () => {

                window.location.href =
                  link.href;

              },
              200
            );

          }
        );

      });



    /* =========================================================
       VIEW SWITCHER
       ========================================================= */

    function setSingleView(){

      gallery
        .classList
        .remove(
          "three-column"
        );


      singleView
        .classList
        .add(
          "active"
        );


      gridView
        .classList
        .remove(
          "active"
        );


      /*
        Remember visitor's choice.
      */

      try{

        localStorage.setItem(
          "artworkView",
          "single"
        );

      }
      catch(error){

        /* Nothing needed */

      }

    }



    function setGridView(){

      gallery
        .classList
        .add(
          "three-column"
        );


      gridView
        .classList
        .add(
          "active"
        );


      singleView
        .classList
        .remove(
          "active"
        );


      /*
        Remember visitor's choice.
      */

      try{

        localStorage.setItem(
          "artworkView",
          "grid"
        );

      }
      catch(error){

        /* Nothing needed */

      }

    }



    singleView
      .addEventListener(
        "click",
        setSingleView
      );


    gridView
      .addEventListener(
        "click",
        setGridView
      );



    /* =========================================================
       RESTORE PREVIOUS VIEW
       ========================================================= */

    try{

      const savedView =
        localStorage.getItem(
          "artworkView"
        );


      if(
        savedView ===
        "grid"
      ){

        setGridView();

      }
      else{

        setSingleView();

      }

    }
    catch(error){

      setSingleView();

    }



    /* =========================================================
       LOAD ARTWORKS
       ========================================================= */

    async function loadArtworks(){

      try{

        /*
          no-store helps prevent an old
          artworks.json from being displayed
          immediately after publishing.
        */

        const response =
          await fetch(
            "/content/artworks.json",
            {
              cache:"no-store"
            }
          );


        if(
          !response.ok
        ){

          throw new Error(
            "Could not load artworks.json"
          );

        }


        const data =
          await response.json();


        gallery.innerHTML =
          "";


        const artworks =
          Array.isArray(
            data.artworks
          )
            ? data.artworks
            : [];


        if(
          artworks.length === 0
        ){

          gallery.innerHTML =
            `
            <div class="gallery-loading">
              No artwork yet.
            </div>
            `;

          return;

        }



        /*
          IMPORTANT:

          We DO NOT reverse this array.

          Your Decap configuration uses:

          add_to_top: true

          Therefore a new artwork is already
          stored as the first item.

          Example:

          NEW
          Artwork 1
          Artwork 2
          Artwork 3

          Both views preserve this same order.
        */

        artworks.forEach(
          (artwork,index) => {


            /* =============================
               TILE
               ============================= */

            const tile =
              document.createElement(
                "div"
              );


            tile.className =
              "tile";



            /* =============================
               MEDIA
               ============================= */

            const media =
              document.createElement(
                "div"
              );


            media.className =
              "media";



            /* =============================
               IMAGE
               ============================= */

            const img =
              document.createElement(
                "img"
              );


            img.src =
              artwork.image;


            img.alt =
              artwork.alt ||
              `Portfolio artwork ${index + 1}`;


            img.loading =
              index < 2
                ? "eager"
                : "lazy";


            /*
              Helps reduce layout shifting
              while images load.
            */

            img.decoding =
              "async";



            /* =============================
               MISSING IMAGE DEBUG
               ============================= */

            img.addEventListener(
              "error",
              () => {

                console.error(
                  "Missing artwork:",
                  artwork.image
                );

              }
            );



            /* =============================
               FULLSCREEN
               ============================= */

            img.addEventListener(
              "click",
              () => {

                openLightbox(
                  img.currentSrc ||
                  img.src,
                  img.alt
                );

              }
            );



            /* =============================
               BUILD
               ============================= */

            media.appendChild(
              img
            );


            tile.appendChild(
              media
            );


            gallery.appendChild(
              tile
            );

          }
        );


      }
      catch(error){

        console.error(
          "Artwork loading error:",
          error
        );


        gallery.innerHTML =
          `
          <div class="gallery-loading">
            Artwork could not load.
          </div>
          `;

      }

    }



    /* =========================================================
       LIGHTBOX
       ========================================================= */

    function getScrollbarWidth(){

      return (
        window.innerWidth -
        document
          .documentElement
          .clientWidth
      );

    }



    function openLightbox(
      src,
      alt
    ){

      lightboxImg.src =
        src;


      lightboxImg.alt =
        alt || "";


      /*
        Prevent page shifting when the
        scrollbar disappears.
      */

      document
        .documentElement
        .style
        .setProperty(
          "--sbw",
          getScrollbarWidth() +
          "px"
        );


      document.body
        .classList
        .add(
          "lock-scroll"
        );


      lightbox
        .classList
        .add(
          "open"
        );

    }



    function closeLightbox(){

      lightbox
        .classList
        .remove(
          "open"
        );


      document.body
        .classList
        .remove(
          "lock-scroll"
        );


      setTimeout(
        () => {

          if(
            !lightbox
              .classList
              .contains(
                "open"
              )
          ){

            lightboxImg.src =
              "";

          }

        },
        240
      );

    }



    /* =========================================================
       CLOSE BUTTON
       ========================================================= */

    lightboxClose
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          closeLightbox();

        }
      );



    /* =========================================================
       CLICK DARK BACKGROUND
       ========================================================= */

    lightbox
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            lightbox
          ){

            closeLightbox();

          }

        }
      );



    /* =========================================================
       ESCAPE KEY
       ========================================================= */

    window.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Escape" &&
          lightbox
            .classList
            .contains(
              "open"
            )
        ){

          closeLightbox();

        }

      }
    );



    /* =========================================================
       START
       ========================================================= */

    loadArtworks();

  </script>

</body>

</html>
