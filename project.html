<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Project — Jennifer Niu</title>

  <style>

    /* =========================================================
       FONT
       ========================================================= */

    @font-face {
      font-family: "SpaceMono";
      src: url("fonts/SpaceMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SpaceMono";
      src: url("fonts/SpaceMono-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }


    /* =========================================================
       VARIABLES
       ========================================================= */

    :root {
      --bg: #fff;
      --text: #111;

      --page-width: 1100px;
      --gutter: 28px;

      --gap: 18px;

      --transition: 200ms;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        "SpaceMono",
        "Courier New",
        Courier,
        monospace;

      opacity: 0;

      transition:
        opacity var(--transition) ease;
    }

    body.page-loaded {
      opacity: 1;
    }

    body.page-exit {
      opacity: 0;
    }


    /* =========================================================
       TOP NAVIGATION
       ========================================================= */

    nav {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      display: flex;
      justify-content: center;

      gap: 2.2rem;

      padding: .9rem 0;

      z-index: 10;
    }

    nav a {
      text-decoration: none;

      color: var(--text);

      font-size: .95rem;
      font-weight: 700;

      padding: .35rem .75rem;

      border-radius: 999px;

      transition:
        background 150ms ease,
        transform 150ms ease;
    }

    nav a:hover {
      background: rgba(0,0,0,.06);

      transform:
        translateY(-1px);
    }


    /* =========================================================
       PAGE
       ========================================================= */

    main {
      min-height: 100vh;

      padding:
        5.5rem
        var(--gutter)
        4rem;
    }

    .project {
      width: min(
        100%,
        var(--page-width)
      );

      margin: 0 auto;
    }


    /* =========================================================
       PROJECT HEADER
       ========================================================= */

    .project-header {
      margin-bottom: 42px;

      border-bottom:
        1px solid rgba(0,0,0,.16);

      padding-bottom: 20px;
    }

    .project-title {
      margin:
        0
        0
        12px;

      font-size:
        clamp(
          2.2rem,
          5vw,
          4.5rem
        );

      line-height: .95;

      letter-spacing: -.04em;

      font-weight: 700;
    }

    .project-description {
      max-width: 720px;

      margin: 0;

      font-size: .95rem;
      line-height: 1.7;

      font-weight: 400;
    }


    /* =========================================================
       CONTENT
       ========================================================= */

    #projectContent {
      display: flex;

      flex-direction: column;

      gap: 28px;
    }


    /* =========================================================
       GENERAL MEDIA
       ========================================================= */

    .block img,
    .block video {
      display: block;

      width: 100%;
      height: auto;
    }

    .block img {
      cursor: zoom-in;
    }

    .block video {
      background: #000;
    }


    /* =========================================================
       HEADINGS
       ========================================================= */

    .heading {
      margin: 12px 0 0;

      font-weight: 700;

      line-height: 1.05;
    }

    .heading.small {
      font-size: 1.3rem;
    }

    .heading.medium {
      font-size: 2rem;
    }

    .heading.large {
      font-size:
        clamp(
          2.5rem,
          5vw,
          4rem
        );
    }


    /* =========================================================
       TEXT
       ========================================================= */

    .text-block {
      font-size: .95rem;

      line-height: 1.75;

      white-space: pre-line;

      font-weight: 400;
    }

    .text-block.narrow {
      max-width: 520px;
    }

    .text-block.medium {
      max-width: 760px;
    }

    .text-block.full {
      max-width: none;
    }

    .text-block.left {
      margin-right: auto;

      text-align: left;
    }

    .text-block.center {
      margin-left: auto;
      margin-right: auto;

      text-align: center;
    }

    .text-block.right {
      margin-left: auto;

      text-align: right;
    }


    /* =========================================================
       SINGLE IMAGE / GIF
       ========================================================= */

    .single-media {
      width: 100%;
    }

    .single-media.small {
      width: 35%;
    }

    .single-media.medium {
      width: 55%;
    }

    .single-media.large {
      width: 75%;
    }

    .single-media.full {
      width: 100%;
    }

    .caption {
      margin-top: 8px;

      font-size: .75rem;

      line-height: 1.5;

      opacity: .55;
    }


    /* =========================================================
       TWO COLUMN LAYOUTS
       ========================================================= */

    .two-column {
      display: grid;

      gap: var(--gap);

      align-items: start;
    }

    .ratio-1-1 {
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);
    }

    .ratio-1-2 {
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,2fr);
    }

    .ratio-2-1 {
      grid-template-columns:
        minmax(0,2fr)
        minmax(0,1fr);
    }

    .ratio-2-3 {
      grid-template-columns:
        minmax(0,2fr)
        minmax(0,3fr);
    }

    .ratio-3-2 {
      grid-template-columns:
        minmax(0,3fr)
        minmax(0,2fr);
    }

    .ratio-5-3 {
      grid-template-columns:
        minmax(0,5fr)
        minmax(0,3fr);
    }

    .ratio-3-5 {
      grid-template-columns:
        minmax(0,3fr)
        minmax(0,5fr);
    }


    /* =========================================================
       TEXT + IMAGE
       ========================================================= */

    .text-image-text {
      font-size: .95rem;

      line-height: 1.75;

      white-space: pre-line;

      font-weight: 400;
    }


    /* =========================================================
       THREE IMAGES
       ========================================================= */

    .three-images {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap: var(--gap);

      align-items: start;
    }


    /* =========================================================
       SPACERS
       ========================================================= */

    .spacer.small {
      height: 18px;
    }

    .spacer.medium {
      height: 42px;
    }

    .spacer.large {
      height: 90px;
    }


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .back {
      display: inline-block;

      margin-top: 60px;

      color: #111;

      text-decoration: none;

      font-size: .85rem;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: .12em;

      transition: opacity 150ms ease;
    }

    .back:hover {
      opacity: .45;
    }


    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .project-lightbox {
      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        rgba(0,0,0,.88);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 220ms ease;

      z-index: 9999;
    }

    .project-lightbox.open {
      opacity: 1;

      pointer-events: auto;
    }

    .project-lightbox img {
      display: block;

      max-width: 92vw;
      max-height: 92vh;

      width: auto;
      height: auto;

      object-fit: contain;

      opacity: 0;

      transform:
        scale(.955);

      transition:
        opacity 240ms ease,
        transform 240ms
        cubic-bezier(.2,.8,.2,1);

      user-select: none;

      -webkit-user-drag: none;
    }

    .project-lightbox.open img {
      opacity: 1;

      transform:
        scale(1);
    }

    .project-lightbox-close {
      position: absolute;

      top: 20px;
      right: 26px;

      width: 42px;
      height: 42px;

      border: 0;

      background: transparent;

      color: #fff;

      font-family:
        "SpaceMono",
        "Courier New",
        monospace;

      font-size: 30px;
      font-weight: 400;

      line-height: 1;

      cursor: pointer;

      opacity: .7;

      z-index: 2;

      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }

    .project-lightbox-close:hover {
      opacity: 1;

      transform:
        scale(1.08);
    }


    /* =========================================================
       ERROR
       ========================================================= */

    .error {
      padding: 50px 0;

      font-size: .95rem;

      line-height: 1.7;

      opacity: .55;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 700px) {

      main {
        padding:
          5rem
          18px
          3rem;
      }

      #projectContent {
        gap: 20px;
      }

      .two-column,
      .three-images {
        grid-template-columns:
          1fr;
      }

      .single-media.small,
      .single-media.medium,
      .single-media.large {
        width: 100%;
      }

      .project-header {
        margin-bottom: 28px;
      }

      .project-lightbox {
        padding: 12px;
      }

      .project-lightbox img {
        max-width: 96vw;
        max-height: 90vh;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       AUTOMATIC FULLSCREEN IMAGE LIGHTBOX
       ======================================================= -->

  <div
    class="project-lightbox"
    id="projectLightbox"
    aria-hidden="true"
  >

    <button
      class="project-lightbox-close"
      id="projectLightboxClose"
      aria-label="Close image"
      type="button"
    >
      ×
    </button>

    <img
      id="projectLightboxImg"
      src=""
      alt=""
    >

  </div>


  <!-- =======================================================
       NAVIGATION
       ======================================================= -->

  <nav>

    <a
      href="index.html"
      data-nav>
      Home
    </a>

    <a
      href="portfolio.html"
      data-nav>
      Portfolio
    </a>

    <a
      href="about.html"
      data-nav>
      About
    </a>

  </nav>


  <!-- =======================================================
       PROJECT
       ======================================================= -->

  <main>

    <article
      class="project"
      id="project">


      <!-- HEADER -->

      <header
        class="project-header">

        <h1
          class="project-title"
          id="projectTitle">
        </h1>


        <p
          class="project-description"
          id="projectDescription">
        </p>

      </header>


      <!-- CONTENT GENERATED FROM DECAP -->

      <div
        id="projectContent">
      </div>


      <!-- BACK -->

      <a
        class="back"
        href="projects.html"
        data-nav>

        ← Back to Projects

      </a>


    </article>

  </main>


  <script>

    /* =========================================================
       PAGE FADE
       ========================================================= */

    window.addEventListener(
      "load",
      () => {

        document.body
          .classList
          .add("page-loaded");

      }
    );


    /* =========================================================
       NAVIGATION FADE
       ========================================================= */

    document
      .querySelectorAll("[data-nav]")
      .forEach(link => {

        link.addEventListener(
          "click",
          event => {

            event.preventDefault();

            document.body
              .classList
              .add("page-exit");

            setTimeout(
              () => {

                window.location.href =
                  link.href;

              },
              200
            );

          }
        );

      });


    /* =========================================================
       HELPERS
       ========================================================= */

    function makeImage(src, alt = "") {

      const img =
        document.createElement("img");

      img.src = src;

      img.alt = alt;

      img.loading = "lazy";

      return img;

    }


    function makeVideo(src) {

      const video =
        document.createElement("video");

      video.src = src;

      video.controls = true;

      video.playsInline = true;

      video.preload = "metadata";

      return video;

    }


    function makeBlock() {

      const block =
        document.createElement("div");

      block.className = "block";

      return block;

    }


    /* =========================================================
       RENDER BLOCK
       ========================================================= */

    function renderBlock(block) {

      if (!block || !block.type) {
        return null;
      }


      const wrapper =
        makeBlock();


      /* HEADING */

      if (block.type === "heading") {

        const heading =
          document.createElement("h2");

        heading.className =
          "heading " +
          (block.size || "medium");

        heading.textContent =
          block.text || "";

        wrapper.appendChild(
          heading
        );

        return wrapper;

      }


      /* TEXT */

      if (block.type === "text") {

        const text =
          document.createElement("div");

        text.className =
          "text-block " +
          (block.width || "medium") +
          " " +
          (block.align || "left");

        text.textContent =
          block.text || "";

        wrapper.appendChild(
          text
        );

        return wrapper;

      }


      /* IMAGE */

      if (block.type === "image") {

        const media =
          document.createElement("div");

        media.className =
          "single-media " +
          (block.width || "full");


        media.appendChild(
          makeImage(
            block.image,
            block.caption || ""
          )
        );


        if (block.caption) {

          const caption =
            document.createElement("div");

          caption.className =
            "caption";

          caption.textContent =
            block.caption;

          media.appendChild(
            caption
          );

        }


        wrapper.appendChild(
          media
        );

        return wrapper;

      }


      /* GIF */

      if (block.type === "gif") {

        const media =
          document.createElement("div");

        media.className =
          "single-media " +
          (block.width || "full");


        media.appendChild(
          makeImage(
            block.image,
            ""
          )
        );


        wrapper.appendChild(
          media
        );

        return wrapper;

      }


      /* VIDEO */

      if (block.type === "video") {

        const media =
          document.createElement("div");

        media.className =
          "single-media " +
          (block.width || "full");


        media.appendChild(
          makeVideo(
            block.video
          )
        );


        wrapper.appendChild(
          media
        );

        return wrapper;

      }


      /* TEXT + IMAGE */

      if (block.type === "text_image") {

        const row =
          document.createElement("div");

        row.className =
          "two-column ratio-" +
          (block.ratio || "1-1");


        const text =
          document.createElement("div");

        text.className =
          "text-image-text";

        text.textContent =
          block.text || "";


        const image =
          makeImage(
            block.image,
            ""
          );


        if (
          block.image_position === "left"
        ) {

          row.appendChild(image);

          row.appendChild(text);

        } else {

          row.appendChild(text);

          row.appendChild(image);

        }


        wrapper.appendChild(row);

        return wrapper;

      }


      /* TWO IMAGES */

      if (block.type === "two_images") {

        const row =
          document.createElement("div");

        row.className =
          "two-column ratio-" +
          (block.ratio || "1-1");


        row.appendChild(
          makeImage(
            block.image1,
            ""
          )
        );


        row.appendChild(
          makeImage(
            block.image2,
            ""
          )
        );


        wrapper.appendChild(row);

        return wrapper;

      }


      /* THREE IMAGES */

      if (block.type === "three_images") {

        const row =
          document.createElement("div");

        row.className =
          "three-images";


        row.appendChild(
          makeImage(
            block.image1,
            ""
          )
        );


        row.appendChild(
          makeImage(
            block.image2,
            ""
          )
        );


        row.appendChild(
          makeImage(
            block.image3,
            ""
          )
        );


        wrapper.appendChild(row);

        return wrapper;

      }


      /* VIDEO + IMAGE */

      if (block.type === "video_image") {

        const row =
          document.createElement("div");

        row.className =
          "two-column ratio-" +
          (block.ratio || "5-3");


        row.appendChild(
          makeVideo(
            block.video
          )
        );


        row.appendChild(
          makeImage(
            block.image,
            ""
          )
        );


        wrapper.appendChild(row);

        return wrapper;

      }


      /* SPACER */

      if (block.type === "spacer") {

        const spacer =
          document.createElement("div");

        spacer.className =
          "spacer " +
          (block.size || "medium");


        wrapper.appendChild(
          spacer
        );

        return wrapper;

      }


      return null;

    }


    /* =========================================================
       LOAD PROJECT
       ========================================================= */

    async function loadProject() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const slug =
        params.get("project");


      const titleElement =
        document.getElementById(
          "projectTitle"
        );


      const descriptionElement =
        document.getElementById(
          "projectDescription"
        );


      const contentElement =
        document.getElementById(
          "projectContent"
        );


      /* No slug */

      if (!slug) {

        titleElement.textContent =
          "Project not found";

        descriptionElement.remove();

        contentElement.innerHTML = `
          <div class="error">
            No project was specified.
          </div>
        `;

        return;

      }


      try {

        const response =
          await fetch(
            "/content/projects.json?v=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "Could not load projects.json"
          );

        }


        const data =
          await response.json();


        const projects =
          Array.isArray(data.projects)
            ? data.projects
            : [];


        const project =
          projects.find(
            item =>
              item.slug === slug
          );


        if (!project) {

          titleElement.textContent =
            "Project not found";

          descriptionElement.remove();

          contentElement.innerHTML = `
            <div class="error">
              This project does not exist.
            </div>
          `;

          return;

        }


        /* TITLE */

        titleElement.textContent =
          project.title || "Untitled";


        document.title =
          (project.title || "Project") +
          " — Jennifer Niu";


        /* DESCRIPTION */

        if (project.description) {

          descriptionElement.textContent =
            project.description;

        } else {

          descriptionElement.remove();

        }


        /* BLOCKS */

        const blocks =
          Array.isArray(project.blocks)
            ? project.blocks
            : [];


        blocks.forEach(block => {

          const rendered =
            renderBlock(block);

          if (rendered) {

            contentElement
              .appendChild(rendered);

          }

        });


      } catch (error) {

        console.error(
          "Project loading error:",
          error
        );


        titleElement.textContent =
          "Unable to load project";


        descriptionElement.remove();


        contentElement.innerHTML = `
          <div class="error">
            There was a problem loading this project.
          </div>
        `;

      }

    }


    /* =========================================================
       AUTOMATIC LIGHTBOX
       ========================================================= */

    const projectLightbox =
      document.getElementById(
        "projectLightbox"
      );


    const projectLightboxImg =
      document.getElementById(
        "projectLightboxImg"
      );


    const projectLightboxClose =
      document.getElementById(
        "projectLightboxClose"
      );


    function openProjectLightbox(img) {

      projectLightboxImg.src =
        img.src;

      projectLightboxImg.alt =
        img.alt || "";


      projectLightbox
        .classList
        .add("open");


      projectLightbox
        .setAttribute(
          "aria-hidden",
          "false"
        );


      document.body.style.overflow =
        "hidden";

    }


    function closeProjectLightbox() {

      projectLightbox
        .classList
        .remove("open");


      projectLightbox
        .setAttribute(
          "aria-hidden",
          "true"
        );


      document.body.style.overflow =
        "";


      setTimeout(
        () => {

          if (
            !projectLightbox
              .classList
              .contains("open")
          ) {

            projectLightboxImg.src =
              "";

          }

        },
        240
      );

    }


    /*
      This is the important part.

      Because we're listening on the document,
      images created later by Decap's project
      renderer automatically work too.
    */

    document.addEventListener(
      "click",
      event => {

        const img =
          event.target.closest(
            "#projectContent img"
          );


        if (!img) {
          return;
        }


        openProjectLightbox(
          img
        );

      }
    );


    /* X BUTTON */

    projectLightboxClose
      .addEventListener(
        "click",
        event => {

          event.stopPropagation();

          closeProjectLightbox();

        }
      );


    /* CLICK DARK BACKGROUND */

    projectLightbox
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            projectLightbox
          ) {

            closeProjectLightbox();

          }

        }
      );


    /* ESCAPE */

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          projectLightbox
            .classList
            .contains("open")
        ) {

          closeProjectLightbox();

        }

      }
    );


    /* =========================================================
       START
       ========================================================= */

    loadProject();

  </script>


</body>
</html>
