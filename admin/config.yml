backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "artworks"
    label: "Artworks"

    files:
      - name: "artworks"
        label: "Artwork Gallery"
        file: "content/artworks.json"

        fields:
          - label: "Artworks"
            name: "artworks"
            widget: "list"

            fields:
              - label: "Image"
                name: "image"
                widget: "image"
