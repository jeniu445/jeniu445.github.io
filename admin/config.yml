backend:
  name: git-gateway
  branch: draft

media_folder: "images"
public_folder: "/images"


collections:

  # ============================================================
  # ARTWORKS
  # ============================================================

  - name: "artworks"
    label: "Artworks"

    files:

      - name: "artworks"
        label: "Artwork Gallery"
        file: "content/artworks.json"

        fields:

          - label: "Artwork"
            name: "artworks"
            widget: "list"

            summary: "{{fields.image}}"

            collapsed: false

            allow_add: true
            allow_remove: true
            allow_reorder: true

            fields:

              - label: "Image"
                name: "image"
                widget: "image"
                choose_url: false



  # ============================================================
  # PHOTOGRAPHY
  # ============================================================

  - name: "photography"
    label: "Photography"

    files:

      - name: "photography"
        label: "Photography Collections"
        file: "content/photography.json"

        fields:

          - label: "Collections"
            name: "collections"
            widget: "list"

            label_singular: "Collection"

            summary: "{{fields.title}}"

            collapsed: true

            allow_add: true
            allow_remove: true
            allow_reorder: true

            fields:

              # COLLECTION TITLE

              - label: "Collection Title"
                name: "title"
                widget: "string"


              # PHOTOS

              - label: "Photos"
                name: "photos"
                widget: "list"

                label_singular: "Photo"

                summary: "{{fields.image}}"

                collapsed: false

                allow_add: true
                allow_remove: true
                allow_reorder: true

                fields:

                  - label: "Image"
                    name: "image"
                    widget: "image"
                    choose_url: false

                    media_folder: "/images/photography"
                    public_folder: "/images/photography"



  # ============================================================
  # PROJECTS
  # ============================================================

  - name: "projects"
    label: "Projects"

    files:

      - name: "projects"
        label: "Projects"
        file: "content/projects.json"

        fields:

          - label: "Projects"
            name: "projects"
            widget: "list"

            label_singular: "Project"

            summary: "{{fields.title}}"

            collapsed: true

            allow_add: true
            allow_remove: true
            allow_reorder: true


            fields:

              # ==================================================
              # PROJECT INFORMATION
              # ==================================================

              - label: "Project Title"
                name: "title"
                widget: "string"


              - label: "Slug"
                name: "slug"
                widget: "string"

                hint: "Lowercase words separated with hyphens. Example: my-new-project"


              # ==================================================
              # EXISTING CUSTOM PAGE
              #
              # ONLY your old projects need this.
              #
              # Follow the Red:
              # /follow-the-red.html
              #
              # Changing:
              # /changing.html
              #
              # Bench:
              # /bench.html
              #
              # Paper Forms:
              # /paper-forms.html
              #
              # NEW PROJECTS:
              # LEAVE THIS EMPTY.
              # ==================================================

              - label: "Existing Page URL"
                name: "url"
                widget: "string"
                required: false

                hint: "Leave blank for new projects. Existing custom projects can use paths such as /bench.html"


              # ==================================================
              # BANNER
              # ==================================================

              - label: "Banner Image"
                name: "banner"
                widget: "image"

                choose_url: false

                media_folder: "/images/projects"
                public_folder: "/images/projects"


              # ==================================================
              # OPTIONAL DESCRIPTION
              # ==================================================

              - label: "Description"
                name: "description"
                widget: "text"
                required: false



              # ==================================================
              # PAGE CONTENT
              #
              # Add as many blocks as you want.
              #
              # You can:
              #
              # ADD
              # DELETE
              # REORDER
              #
              # these blocks through Decap.
              # ==================================================

              - label: "Page Content"
                name: "blocks"
                widget: "list"

                label_singular: "Content Block"

                collapsed: true

                allow_add: true
                allow_remove: true
                allow_reorder: true


                types:


                  # ==============================================
                  # HEADING
                  # ==============================================

                  - label: "Heading"
                    name: "heading"
                    widget: "object"

                    fields:

                      - label: "Heading"
                        name: "text"
                        widget: "string"


                      - label: "Size"
                        name: "size"
                        widget: "select"

                        default: "medium"

                        options:

                          - label: "Small"
                            value: "small"

                          - label: "Medium"
                            value: "medium"

                          - label: "Large"
                            value: "large"



                  # ==============================================
                  # TEXT
                  # ==============================================

                  - label: "Text"
                    name: "text"
                    widget: "object"

                    fields:

                      - label: "Text"
                        name: "text"
                        widget: "text"


                      - label: "Text Width"
                        name: "width"
                        widget: "select"

                        default: "medium"

                        options:

                          - label: "Narrow"
                            value: "narrow"

                          - label: "Medium"
                            value: "medium"

                          - label: "Full Width"
                            value: "full"


                      - label: "Alignment"
                        name: "align"
                        widget: "select"

                        default: "left"

                        options:

                          - label: "Left"
                            value: "left"

                          - label: "Center"
                            value: "center"

                          - label: "Right"
                            value: "right"



                  # ==============================================
                  # SINGLE IMAGE
                  # ==============================================

                  - label: "Image"
                    name: "image"
                    widget: "object"

                    fields:

                      - label: "Image"
                        name: "image"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Image Width"
                        name: "width"
                        widget: "select"

                        default: "full"

                        options:

                          - label: "Small"
                            value: "small"

                          - label: "Medium"
                            value: "medium"

                          - label: "Large"
                            value: "large"

                          - label: "Full Width"
                            value: "full"


                      - label: "Caption"
                        name: "caption"
                        widget: "string"
                        required: false



                  # ==============================================
                  # GIF
                  # ==============================================

                  - label: "GIF"
                    name: "gif"
                    widget: "object"

                    fields:

                      - label: "GIF"
                        name: "image"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "GIF Width"
                        name: "width"
                        widget: "select"

                        default: "full"

                        options:

                          - label: "Small"
                            value: "small"

                          - label: "Medium"
                            value: "medium"

                          - label: "Large"
                            value: "large"

                          - label: "Full Width"
                            value: "full"



                  # ==============================================
                  # VIDEO
                  # ==============================================

                  - label: "Video"
                    name: "video"
                    widget: "object"

                    fields:

                      - label: "Video File"
                        name: "video"
                        widget: "file"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Video Width"
                        name: "width"
                        widget: "select"

                        default: "full"

                        options:

                          - label: "Medium"
                            value: "medium"

                          - label: "Large"
                            value: "large"

                          - label: "Full Width"
                            value: "full"



                  # ==============================================
                  # TEXT + IMAGE
                  # ==============================================

                  - label: "Text + Image"
                    name: "text_image"
                    widget: "object"

                    fields:

                      - label: "Text"
                        name: "text"
                        widget: "text"


                      - label: "Image"
                        name: "image"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Image Position"
                        name: "image_position"
                        widget: "select"

                        default: "right"

                        options:

                          - label: "Image Left"
                            value: "left"

                          - label: "Image Right"
                            value: "right"


                      - label: "Column Ratio"
                        name: "ratio"
                        widget: "select"

                        default: "1-1"

                        options:

                          - label: "1 : 1"
                            value: "1-1"

                          - label: "1 : 2"
                            value: "1-2"

                          - label: "2 : 1"
                            value: "2-1"

                          - label: "2 : 3"
                            value: "2-3"

                          - label: "3 : 2"
                            value: "3-2"



                  # ==============================================
                  # TWO IMAGES
                  # ==============================================

                  - label: "Two Images"
                    name: "two_images"
                    widget: "object"

                    fields:

                      - label: "Image 1"
                        name: "image1"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Image 2"
                        name: "image2"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Column Ratio"
                        name: "ratio"
                        widget: "select"

                        default: "1-1"

                        options:

                          - label: "1 : 1"
                            value: "1-1"

                          - label: "1 : 2"
                            value: "1-2"

                          - label: "2 : 1"
                            value: "2-1"

                          - label: "2 : 3"
                            value: "2-3"

                          - label: "3 : 2"
                            value: "3-2"



                  # ==============================================
                  # THREE IMAGES
                  # ==============================================

                  - label: "Three Images"
                    name: "three_images"
                    widget: "object"

                    fields:

                      - label: "Image 1"
                        name: "image1"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Image 2"
                        name: "image2"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Image 3"
                        name: "image3"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"



                  # ==============================================
                  # VIDEO + IMAGE
                  #
                  # Useful for layouts such as your
                  # Changing project.
                  # ==============================================

                  - label: "Video + Image"
                    name: "video_image"
                    widget: "object"

                    fields:

                      - label: "Video"
                        name: "video"
                        widget: "file"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Image"
                        name: "image"
                        widget: "image"

                        choose_url: false

                        media_folder: "/images/projects"
                        public_folder: "/images/projects"


                      - label: "Column Ratio"
                        name: "ratio"
                        widget: "select"

                        default: "5-3"

                        options:

                          - label: "1 : 1"
                            value: "1-1"

                          - label: "5 : 3"
                            value: "5-3"

                          - label: "3 : 5"
                            value: "3-5"

                          - label: "2 : 1"
                            value: "2-1"



                  # ==============================================
                  # SPACER
                  #
                  # Lets you manually add vertical whitespace
                  # between sections.
                  # ==============================================

                  - label: "Spacer"
                    name: "spacer"
                    widget: "object"

                    fields:

                      - label: "Spacing"
                        name: "size"
                        widget: "select"

                        default: "medium"

                        options:

                          - label: "Small"
                            value: "small"

                          - label: "Medium"
                            value: "medium"

                          - label: "Large"
                            value: "large"

  # ============================================================
  # ABOUT
  # ============================================================

  - name: "about"
    label: "About"

    files:

      - name: "about"
        label: "About Page"
        file: "content/about.json"

        fields:

          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Bio Paragraphs"
            name: "paragraphs"
            widget: "list"
            label_singular: "Paragraph"
            collapsed: false
            allow_add: true
            allow_remove: true
            allow_reorder: true

            field:
              label: "Paragraph"
              name: "paragraph"
              widget: "text"

          - label: "Contact Email"
            name: "contact"
            widget: "string"

          - label: "Headshot"
            name: "headshot"
            widget: "image"
            choose_url: false
            media_folder: "/images"
            public_folder: "/images"
