  <style>

    /* =========================================================
       COLLAGE EDITOR
       ========================================================= */

    .collage-editor{
      width:100%;
      margin-top:12px;
    }


    .collage-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:16px;

      margin-bottom:12px;
    }


    .collage-help{
      max-width:820px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:13px;
      line-height:1.5;

      color:#555;
    }


    .collage-toolbar-right{
      display:flex;
      align-items:center;

      gap:10px;
    }


    .selection-count{
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:12px;

      color:#777;

      white-space:nowrap;
    }


    .collage-button{
      border:1px solid #bbb;

      border-radius:4px;

      background:#fff;

      padding:7px 11px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:12px;

      cursor:pointer;
    }


    .collage-button:hover{
      background:#f4f4f4;
    }


    .collage-status{
      padding:24px;

      border:1px solid #ddd;

      background:#fafafa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:14px;

      color:#666;
    }



    /* =========================================================
       VIEWPORT
       ========================================================= */

    .collage-viewport{
      position:relative;

      width:100%;

      overflow:hidden;

      border:1px solid #d4d4d4;

      background:#fff;
    }



    /* =========================================================
       FIXED 1600PX ARTBOARD
       ========================================================= */

    .collage-artboard{
      position:absolute;

      top:0;
      left:0;

      width:1600px;

      transform-origin:
        top left;

      background:
        linear-gradient(
          to right,
          rgba(0,0,0,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.035) 1px,
          transparent 1px
        );

      background-size:
        80px 80px;

      user-select:none;

      touch-action:none;

      cursor:default;
    }



    /* =========================================================
       CENTER GUIDE
       ========================================================= */

    .collage-center-line{
      position:absolute;

      top:0;
      bottom:0;

      left:800px;

      width:1px;

      background:
        rgba(0,0,0,.08);

      pointer-events:none;
    }



    /* =========================================================
       MARQUEE / BOX SELECTION
       ========================================================= */

    .collage-marquee{
      position:absolute;

      z-index:5000;

      border:
        2px solid rgba(17,17,17,.8);

      background:
        rgba(17,17,17,.06);

      pointer-events:none;

      box-sizing:border-box;
    }



    /* =========================================================
       ARTWORK
       ========================================================= */

    .collage-item{
      position:absolute;

      box-sizing:border-box;

      cursor:grab;

      outline:
        2px solid transparent;

      outline-offset:
        4px;

      touch-action:none;
    }


    .collage-item:hover{
      outline-color:
        rgba(0,0,0,.25);
    }


    .collage-item.selected{
      outline-color:#111;
    }


    .collage-item.dragging{
      z-index:1000;

      cursor:grabbing;

      outline-color:#111;
    }


    .collage-item img{
      display:block;

      width:100%;
      height:auto;

      pointer-events:none;

      user-select:none;

      -webkit-user-drag:none;
    }



    /* =========================================================
       RESIZE HANDLE
       ========================================================= */

    .collage-resize{
      position:absolute;

      right:-11px;
      bottom:-11px;

      width:22px;
      height:22px;

      border:3px solid #111;

      background:#fff;

      cursor:nwse-resize;

      opacity:0;

      transition:
        opacity 100ms ease;
    }


    .collage-item:hover
    .collage-resize,

    .collage-item.selected
    .collage-resize{
      opacity:1;
    }



    /* =========================================================
       IMAGE LABEL
       ========================================================= */

    .collage-label{
      position:absolute;

      left:0;
      bottom:100%;

      margin-bottom:7px;

      max-width:300px;

      padding:
        5px 8px;

      overflow:hidden;

      white-space:nowrap;

      text-overflow:ellipsis;

      background:
        rgba(0,0,0,.75);

      color:#fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:14px;

      opacity:0;

      pointer-events:none;
    }


    .collage-item:hover
    .collage-label,

    .collage-item.selected
    .collage-label{
      opacity:1;
    }

  </style>

</head>


<body>


  <script>

    /* =========================================================
       SHARED DESIGN SYSTEM
       ========================================================= */

    const DESIGN_WIDTH =
      1600;


    const MIN_DESIGN_HEIGHT =
      1100;



    /* =========================================================
       HELPERS
       ========================================================= */

    function clamp(
      value,
      min,
      max
    ){

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }



    function normalizeValue(
      value
    ){

      if(!value){

        return [];

      }


      if(
        typeof value.toJS ===
        "function"
      ){

        value =
          value.toJS();

      }


      return Array.isArray(
        value
      )
        ? value
        : [];

    }



    function rectanglesIntersect(
      first,
      second
    ){

      return !(
        first.right <
        second.left ||

        first.left >
        second.right ||

        first.bottom <
        second.top ||

        first.top >
        second.bottom
      );

    }



    /* =========================================================
       COLLAGE CONTROL
       ========================================================= */

    const CollageControl =
      createClass({



        /* =====================================================
           INITIAL STATE
           ===================================================== */

        getInitialState:
          function(){

            return{

              loading:true,

              error:null,

              items:[],

              scale:1,

              selectedIndices:[],

              activeIndex:null,

              /*
                null when no box selection
                is currently visible.
              */

              marqueeRect:null

            };

          },



        /* =====================================================
           COMPONENT MOUNT
           ===================================================== */

        componentDidMount:
          function(){

            this.shiftDown =
              false;


            this.loadArtwork();


            window.addEventListener(
              "resize",
              this.updateScale
            );



            /* ===============================================
               GLOBAL SHIFT TRACKING
               =============================================== */

            this.handleShiftKeyDown =
              event => {

                if(
                  event.key ===
                  "Shift"
                ){

                  this.shiftDown =
                    true;

                }

              };


            this.handleShiftKeyUp =
              event => {

                if(
                  event.key ===
                  "Shift"
                ){

                  this.shiftDown =
                    false;

                }

              };


            window.addEventListener(
              "keydown",
              this.handleShiftKeyDown
            );


            window.addEventListener(
              "keyup",
              this.handleShiftKeyUp
            );

          },



        /* =====================================================
           COMPONENT UNMOUNT
           ===================================================== */

        componentWillUnmount:
          function(){

            window.removeEventListener(
              "resize",
              this.updateScale
            );


            window.removeEventListener(
              "keydown",
              this.handleShiftKeyDown
            );


            window.removeEventListener(
              "keyup",
              this.handleShiftKeyUp
            );


            this.removePointerListeners();

            this.removeMarqueeListeners();

          },



        /* =====================================================
           COMPONENT UPDATE
           ===================================================== */

        componentDidUpdate:
          function(){

            this.updateScale();

          },



        /* =====================================================
           SCALE ARTBOARD
           ===================================================== */

        updateScale:
          function(){

            if(
              !this.viewportNode
            ){

              return;

            }


            const availableWidth =
              this.viewportNode
                .clientWidth;


            if(
              !availableWidth
            ){

              return;

            }


            const nextScale =
              Math.min(

                1,

                availableWidth /
                DESIGN_WIDTH

              );


            if(
              Math.abs(
                nextScale -
                this.state.scale
              ) >
              .001
            ){

              this.setState({

                scale:
                  nextScale

              });

            }

          },



        /* =====================================================
           LOAD ARTWORK
           ===================================================== */

        loadArtwork:
          async function(){

            try{

              const response =
                await fetch(

                  "/content/artworks.json?v=" +
                  Date.now(),

                  {
                    cache:"no-store"
                  }

                );


              if(
                !response.ok
              ){

                throw new Error(
                  "Could not load artworks.json"
                );

              }


              const data =
                await response.json();


              const artworks =
                Array.isArray(
                  data.artworks
                )
                  ? data.artworks
                  : [];


              const existing =
                normalizeValue(
                  this.props.value
                );



              /* =================================================
                 MIGRATE OLD PERCENT VALUES
                 ================================================= */

              const looksLikeOldPercentageData =
                existing.length > 0 &&
                existing.every(
                  item =>

                    Number(
                      item.width
                    ) <= 100

                );


              const savedByImage =
                {};


              existing.forEach(
                function(item){

                  if(
                    !item ||
                    !item.image
                  ){

                    return;

                  }


                  let x =
                    Number(
                      item.x
                    ) || 0;


                  let y =
                    Number(
                      item.y
                    ) || 0;


                  let width =
                    Number(
                      item.width
                    ) || 400;



                  if(
                    looksLikeOldPercentageData
                  ){

                    x =
                      (
                        x /
                        100
                      ) *
                      DESIGN_WIDTH;


                    width =
                      (
                        width /
                        100
                      ) *
                      DESIGN_WIDTH;

                  }


                  savedByImage[
                    item.image
                  ] = {

                    image:
                      item.image,

                    x:
                      x,

                    y:
                      y,

                    width:
                      width

                  };

                }
              );



              /* =================================================
                 STARTING POSITIONS
                 ================================================= */

              const starterPositions = [

                {
                  x:70,
                  y:80,
                  width:390
                },

                {
                  x:570,
                  y:130,
                  width:400
                },

                {
                  x:1150,
                  y:100,
                  width:360
                },

                {
                  x:240,
                  y:430,
                  width:380
                },

                {
                  x:780,
                  y:500,
                  width:370
                },

                {
                  x:1180,
                  y:500,
                  width:300
                }

              ];



              const items =
                artworks.map(
                  function(
                    artwork,
                    index
                  ){

                    const saved =
                      savedByImage[
                        artwork.image
                      ];


                    if(saved){

                      return saved;

                    }


                    const slot =
                      starterPositions[
                        index %
                        starterPositions.length
                      ];


                    const band =
                      Math.floor(

                        index /
                        starterPositions.length

                      );


                    return{

                      image:
                        artwork.image,

                      x:
                        slot.x,

                      y:
                        slot.y +
                        band *
                        700,

                      width:
                        slot.width

                    };

                  }
                );



              this.setState(

                {

                  loading:false,

                  error:null,

                  items:
                    items,

                  selectedIndices:[],

                  activeIndex:null,

                  marqueeRect:null

                },


                () => {

                  this.updateScale();


                  this.props.onChange(
                    items
                  );

                }

              );


            }
            catch(error){

              console.error(
                "Collage editor error:",
                error
              );


              this.setState({

                loading:false,

                error:
                  "Could not load artwork. Make sure artworks.json exists on this branch."

              });

            }

          },



        /* =====================================================
           ARTBOARD HEIGHT
           ===================================================== */

        getDesignHeight:
          function(){

            if(
              !this.state.items.length
            ){

              return MIN_DESIGN_HEIGHT;

            }


            const lowestY =
              this.state.items.reduce(

                function(
                  result,
                  item
                ){

                  return Math.max(

                    result,

                    Number(
                      item.y
                    ) || 0

                  );

                },

                0

              );


            return Math.max(

              MIN_DESIGN_HEIGHT,

              lowestY +
              800

            );

          },



        /* =====================================================
           SHIFT DETECTION
           ===================================================== */

        isShiftPressed:
          function(event){

            if(
              this.shiftDown ===
              true
            ){

              return true;

            }


            if(
              event &&
              event.shiftKey ===
              true
            ){

              return true;

            }


            if(
              event &&
              event.nativeEvent &&
              event.nativeEvent.shiftKey ===
              true
            ){

              return true;

            }


            return false;

          },



        /* =====================================================
           CLEAR SELECTION
           ===================================================== */

        clearSelection:
          function(){

            this.setState({

              selectedIndices:[],

              activeIndex:null,

              marqueeRect:null

            });

          },



        /* =====================================================
           CONVERT POINTER TO DESIGN COORDINATES
           ===================================================== */

        getDesignPointerPosition:
          function(event){

            if(
              !this.artboardNode
            ){

              return{
                x:0,
                y:0
              };

            }


            const rect =
              this.artboardNode
                .getBoundingClientRect();


            const scale =
              this.state.scale ||
              1;


            return{

              x:
                (
                  event.clientX -
                  rect.left
                ) /
                scale,

              y:
                (
                  event.clientY -
                  rect.top
                ) /
                scale

            };

          },



        /* =====================================================
           START MARQUEE
           ===================================================== */

        startMarquee:
          function(event){

            /*
              Only start if clicking directly
              on empty artboard.
            */

            if(
              event.target !==
              event.currentTarget
            ){

              return;

            }


            event.preventDefault();


            const position =
              this.getDesignPointerPosition(
                event
              );


            const shiftPressed =
              this.isShiftPressed(
                event
              );


            this.marqueeData = {

              startX:
                position.x,

              startY:
                position.y,

              shiftPressed:
                shiftPressed,

              /*
                Remember selection before box drag
                when Shift is being used.
              */

              originalSelection:
                this.state
                  .selectedIndices
                  .slice(),

              moved:false

            };


            this.setState({

              activeIndex:null,

              marqueeRect:{

                left:
                  position.x,

                top:
                  position.y,

                width:0,

                height:0

              }

            });


            window.addEventListener(
              "pointermove",
              this.handleMarqueeMove
            );


            window.addEventListener(
              "pointerup",
              this.handleMarqueeUp
            );

          },



        /* =====================================================
           MARQUEE MOVE
           ===================================================== */

        handleMarqueeMove:
          function(event){

            if(
              !this.marqueeData
            ){

              return;

            }


            event.preventDefault();


            const position =
              this.getDesignPointerPosition(
                event
              );


            const startX =
              this.marqueeData.startX;


            const startY =
              this.marqueeData.startY;


            const currentX =
              clamp(
                position.x,
                0,
                DESIGN_WIDTH
              );


            const currentY =
              Math.max(
                0,
                position.y
              );


            const left =
              Math.min(
                startX,
                currentX
              );


            const top =
              Math.min(
                startY,
                currentY
              );


            const right =
              Math.max(
                startX,
                currentX
              );


            const bottom =
              Math.max(
                startY,
                currentY
              );


            const width =
              right -
              left;


            const height =
              bottom -
              top;



            if(
              width > 3 ||
              height > 3
            ){

              this.marqueeData.moved =
                true;

            }



            /* =================================================
               FIND ARTWORK TOUCHING THE BOX
               ================================================= */

            const marqueeBounds = {

              left:
                left,

              top:
                top,

              right:
                right,

              bottom:
                bottom

            };


            const boxSelected =
              [];


            this.state.items.forEach(
              (
                item,
                index
              ) => {


                const node =
                  this.artboardNode
                    .querySelector(
                      '[data-collage-index="' +
                      index +
                      '"]'
                    );


                if(
                  !node
                ){

                  return;

                }


                const itemLeft =
                  Number(
                    item.x
                  ) || 0;


                const itemTop =
                  Number(
                    item.y
                  ) || 0;


                const itemWidth =
                  Number(
                    item.width
                  ) || 0;


                /*
                  offsetHeight is measured in the
                  unscaled 1600px artboard system.
                */

                const itemHeight =
                  node.offsetHeight;


                const itemBounds = {

                  left:
                    itemLeft,

                  top:
                    itemTop,

                  right:
                    itemLeft +
                    itemWidth,

                  bottom:
                    itemTop +
                    itemHeight

                };


                if(
                  rectanglesIntersect(
                    marqueeBounds,
                    itemBounds
                  )
                ){

                  boxSelected.push(
                    index
                  );

                }

              }
            );



            /* =================================================
               SHIFT + BOX
               Adds to existing selection.

               NORMAL BOX
               Replaces current selection.
               ================================================= */

            let selected;


            if(
              this.marqueeData
                .shiftPressed
            ){

              selected =
                Array.from(
                  new Set(
                    this.marqueeData
                      .originalSelection
                      .concat(
                        boxSelected
                      )
                  )
                );

            }
            else{

              selected =
                boxSelected;

            }



            this.setState({

              selectedIndices:
                selected,

              marqueeRect:{

                left:
                  left,

                top:
                  top,

                width:
                  width,

                height:
                  height

              }

            });

          },



        /* =====================================================
           MARQUEE END
           ===================================================== */

        handleMarqueeUp:
          function(){

            if(
              !this.marqueeData
            ){

              return;

            }


            const moved =
              this.marqueeData.moved;


            const shiftPressed =
              this.marqueeData
                .shiftPressed;


            const originalSelection =
              this.marqueeData
                .originalSelection;


            this.marqueeData =
              null;


            this.removeMarqueeListeners();



            /*
              Simple empty click:
              clear selection unless Shift
              was held.
            */

            if(
              !moved
            ){

              this.setState({

                selectedIndices:
                  shiftPressed
                    ? originalSelection
                    : [],

                marqueeRect:null,

                activeIndex:null

              });

            }
            else{

              this.setState({

                marqueeRect:null,

                activeIndex:null

              });

            }

          },



        /* =====================================================
           REMOVE MARQUEE LISTENERS
           ===================================================== */

        removeMarqueeListeners:
          function(){

            window.removeEventListener(
              "pointermove",
              this.handleMarqueeMove
            );


            window.removeEventListener(
              "pointerup",
              this.handleMarqueeUp
            );

          },



        /* =====================================================
           START POINTER ON ARTWORK
           ===================================================== */

        startPointer:
          function(
            index,
            mode,
            event
          ){

            event.preventDefault();

            event.stopPropagation();


            const item =
              this.state.items[
                index
              ];


            let selected =
              this.state.selectedIndices
                .slice();


            const shiftPressed =
              this.isShiftPressed(
                event
              );



            /* =================================================
               RESIZE
               ================================================= */

            if(
              mode ===
              "resize"
            ){

              if(
                !selected.includes(
                  index
                )
              ){

                selected =
                  [index];

              }

            }



            /* =================================================
               MOVE / SELECTION
               ================================================= */

            if(
              mode ===
              "move"
            ){


              /* ===============================================
                 SHIFT CLICK
                 =============================================== */

              if(
                shiftPressed
              ){


                if(
                  selected.includes(
                    index
                  )
                ){

                  selected =
                    selected.filter(
                      selectedIndex =>

                        selectedIndex !==
                        index

                    );


                  this.setState({

                    selectedIndices:
                      selected,

                    activeIndex:null

                  });


                  return;

                }


                selected =
                  selected.concat(
                    [index]
                  );

              }



              /* ===============================================
                 NORMAL CLICK
                 =============================================== */

              else{

                if(
                  !selected.includes(
                    index
                  )
                ){

                  selected =
                    [index];

                }

              }

            }



            if(
              selected.length ===
              0
            ){

              selected =
                [index];

            }



            /* =================================================
               SAVE ORIGINAL GROUP POSITIONS
               ================================================= */

            const originalPositions =
              {};


            selected.forEach(
              selectedIndex => {

                const selectedItem =
                  this.state.items[
                    selectedIndex
                  ];


                originalPositions[
                  selectedIndex
                ] = {

                  x:
                    Number(
                      selectedItem.x
                    ) || 0,

                  y:
                    Number(
                      selectedItem.y
                    ) || 0,

                  width:
                    Number(
                      selectedItem.width
                    ) || 400

                };

              }
            );



            this.dragData = {

              index:
                index,

              mode:
                mode,

              startClientX:
                event.clientX,

              startClientY:
                event.clientY,

              originalX:
                Number(
                  item.x
                ) || 0,

              originalY:
                Number(
                  item.y
                ) || 0,

              originalWidth:
                Number(
                  item.width
                ) || 400,

              selectedIndices:
                selected.slice(),

              originalPositions:
                originalPositions

            };



            this.setState({

              selectedIndices:
                selected,

              activeIndex:
                index,

              marqueeRect:null

            });



            window.addEventListener(
              "pointermove",
              this.handlePointerMove
            );


            window.addEventListener(
              "pointerup",
              this.handlePointerUp
            );

          },



        /* =====================================================
           ARTWORK POINTER MOVE
           ===================================================== */

        handlePointerMove:
          function(event){

            if(
              !this.dragData
            ){

              return;

            }


            event.preventDefault();


            const drag =
              this.dragData;


            const scale =
              this.state.scale ||
              1;


            let dx =
              (
                event.clientX -
                drag.startClientX
              ) /
              scale;


            let dy =
              (
                event.clientY -
                drag.startClientY
              ) /
              scale;


            const items =
              this.state.items.map(
                item =>

                  Object.assign(
                    {},
                    item
                  )
              );



            /* =================================================
               MOVE SELECTED GROUP
               ================================================= */

            if(
              drag.mode ===
              "move"
            ){

              let minimumDx =
                -Infinity;


              let maximumDx =
                Infinity;


              let minimumDy =
                -Infinity;



              drag.selectedIndices
                .forEach(
                  selectedIndex => {

                    const original =
                      drag.originalPositions[
                        selectedIndex
                      ];


                    minimumDx =
                      Math.max(

                        minimumDx,

                        -original.x

                      );


                    maximumDx =
                      Math.min(

                        maximumDx,

                        DESIGN_WIDTH -
                        (
                          original.x +
                          original.width
                        )

                      );


                    minimumDy =
                      Math.max(

                        minimumDy,

                        -original.y

                      );

                  }
                );



              dx =
                clamp(
                  dx,
                  minimumDx,
                  maximumDx
                );


              dy =
                Math.max(
                  dy,
                  minimumDy
                );



              drag.selectedIndices
                .forEach(
                  selectedIndex => {

                    const original =
                      drag.originalPositions[
                        selectedIndex
                      ];


                    items[
                      selectedIndex
                    ].x =
                      original.x +
                      dx;


                    items[
                      selectedIndex
                    ].y =
                      original.y +
                      dy;

                  }
                );

            }



            /* =================================================
               RESIZE ONE ARTWORK
               ================================================= */

            if(
              drag.mode ===
              "resize"
            ){

              const item =
                items[
                  drag.index
                ];


              const desiredWidth =
                clamp(

                  drag.originalWidth +
                  dx,

                  100,

                  1100

                );


              item.width =
                Math.min(

                  desiredWidth,

                  DESIGN_WIDTH -
                  item.x

                );

            }



            this.setState({

              items:
                items

            });

          },



        /* =====================================================
           ARTWORK POINTER END
           ===================================================== */

        handlePointerUp:
          function(){

            if(
              !this.dragData
            ){

              return;

            }


            this.dragData =
              null;


            this.removePointerListeners();


            this.setState({

              activeIndex:null

            });


            this.props.onChange(
              this.state.items
            );

          },



        /* =====================================================
           REMOVE ARTWORK POINTER LISTENERS
           ===================================================== */

        removePointerListeners:
          function(){

            window.removeEventListener(
              "pointermove",
              this.handlePointerMove
            );


            window.removeEventListener(
              "pointerup",
              this.handlePointerUp
            );

          },



        /* =====================================================
           RESET LAYOUT
           ===================================================== */

        resetLayout:
          function(){

            const starterPositions = [

              {
                x:70,
                y:80,
                width:390
              },

              {
                x:570,
                y:130,
                width:400
              },

              {
                x:1150,
                y:100,
                width:360
              },

              {
                x:240,
                y:430,
                width:380
              },

              {
                x:780,
                y:500,
                width:370
              },

              {
                x:1180,
                y:500,
                width:300
              }

            ];


            const items =
              this.state.items.map(
                function(
                  item,
                  index
                ){

                  const slot =
                    starterPositions[
                      index %
                      starterPositions.length
                    ];


                  const band =
                    Math.floor(

                      index /
                      starterPositions.length

                    );


                  return{

                    image:
                      item.image,

                    x:
                      slot.x,

                    y:
                      slot.y +
                      band *
                      700,

                    width:
                      slot.width

                  };

                }
              );


            this.setState({

              items:
                items,

              selectedIndices:[],

              activeIndex:null,

              marqueeRect:null

            });


            this.props.onChange(
              items
            );

          },



        /* =====================================================
           RENDER ARTWORK
           ===================================================== */

        renderItem:
          function(
            item,
            index
          ){

            const selected =
              this.state
                .selectedIndices
                .includes(
                  index
                );


            const active =
              this.state
                .activeIndex ===
              index;


            let className =
              "collage-item";


            if(
              selected
            ){

              className +=
                " selected";

            }


            if(
              active
            ){

              className +=
                " dragging";

            }



            return h(

              "div",

              {

                key:
                  item.image,

                className:
                  className,

                "data-collage-index":
                  index,

                style:{

                  left:
                    item.x +
                    "px",

                  top:
                    item.y +
                    "px",

                  width:
                    item.width +
                    "px"

                },

                onPointerDown:
                  function(event){

                    this.startPointer(
                      index,
                      "move",
                      event
                    );

                  }.bind(this)

              },



              h(

                "div",

                {
                  className:
                    "collage-label"
                },

                item.image

              ),



              h(

                "img",

                {

                  src:
                    item.image,

                  alt:""

                }

              ),



              h(

                "div",

                {

                  className:
                    "collage-resize",

                  title:
                    "Drag to resize",

                  onPointerDown:
                    function(event){

                      this.startPointer(
                        index,
                        "resize",
                        event
                      );

                    }.bind(this)

                }

              )

            );

          },



        /* =====================================================
           RENDER
           ===================================================== */

        render:
          function(){

            if(
              this.state.loading
            ){

              return h(

                "div",

                {
                  className:
                    "collage-status"
                },

                "Loading artwork..."

              );

            }



            if(
              this.state.error
            ){

              return h(

                "div",

                {
                  className:
                    "collage-status"
                },

                this.state.error

              );

            }



            const designHeight =
              this.getDesignHeight();


            const scale =
              this.state.scale;


            const selectedCount =
              this.state
                .selectedIndices
                .length;


            const marquee =
              this.state
                .marqueeRect;



            return h(

              "div",

              {
                className:
                  "collage-editor"
              },



              /* =================================================
                 TOOLBAR
                 ================================================= */

              h(

                "div",

                {
                  className:
                    "collage-toolbar"
                },



                h(

                  "div",

                  {
                    className:
                      "collage-help"
                  },

                  "Drag over empty canvas to box-select multiple artworks. Hold Shift while box-selecting to add to your current selection. Shift-click also adds/removes individual artworks. Drag any selected artwork to move the whole group."

                ),



                h(

                  "div",

                  {
                    className:
                      "collage-toolbar-right"
                  },


                  selectedCount > 0

                    ? h(

                        "span",

                        {
                          className:
                            "selection-count"
                        },

                        selectedCount +
                        " selected"

                      )

                    : null,



                  selectedCount > 0

                    ? h(

                        "button",

                        {

                          type:
                            "button",

                          className:
                            "collage-button",

                          onClick:
                            this.clearSelection

                        },

                        "Deselect"

                      )

                    : null,



                  h(

                    "button",

                    {

                      type:
                        "button",

                      className:
                        "collage-button",

                      onClick:
                        this.resetLayout

                    },

                    "Reset layout"

                  )

                )

              ),



              /* =================================================
                 VIEWPORT
                 ================================================= */

              h(

                "div",

                {

                  className:
                    "collage-viewport",

                  ref:
                    function(node){

                      this.viewportNode =
                        node;

                    }.bind(this),

                  style:{

                    height:
                      (
                        designHeight *
                        scale
                      ) +
                      "px"

                  }

                },



                /* =================================================
                   ARTBOARD
                   ================================================= */

                h(

                  "div",

                  {

                    className:
                      "collage-artboard",

                    ref:
                      function(node){

                        this.artboardNode =
                          node;

                      }.bind(this),

                    onPointerDown:
                      this.startMarquee,

                    style:{

                      height:
                        designHeight +
                        "px",

                      transform:
                        "scale(" +
                        scale +
                        ")"

                    }

                  },



                  /* CENTER LINE */

                  h(

                    "div",

                    {
                      className:
                        "collage-center-line"
                    }

                  ),



                  /* ARTWORK */

                  this.state.items.map(
                    this.renderItem
                  ),



                  /* MARQUEE RECTANGLE */

                  marquee

                    ? h(

                        "div",

                        {

                          className:
                            "collage-marquee",

                          style:{

                            left:
                              marquee.left +
                              "px",

                            top:
                              marquee.top +
                              "px",

                            width:
                              marquee.width +
                              "px",

                            height:
                              marquee.height +
                              "px"

                          }

                        }

                      )

                    : null

                )

              )

            );

          }

      });



    /* =========================================================
       REGISTER WIDGET
       ========================================================= */

    window.CMS.registerWidget(
      "collage_layout",
      CollageControl
    );



    /* =========================================================
       START DECAP
       ========================================================= */

    window.initCMS();

  </script>
