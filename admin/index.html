<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Jennifer Portfolio Admin</title>


  <!-- ======================================================
       NETLIFY IDENTITY
       ====================================================== -->

  <script
    src="https://identity.netlify.com/v1/netlify-identity-widget.js">
  </script>


  <!-- ======================================================
       IMPORTANT:
       STOP DECAP FROM INITIALIZING AUTOMATICALLY
       ====================================================== -->

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>


  <!-- ======================================================
       DECAP CMS
       ====================================================== -->

  <script
    src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js">
  </script>

</head>


<body>


  <script>

    /* ======================================================
       COLLAGE TEST WIDGET
       ======================================================

       For now this is intentionally simple.

       We are ONLY testing whether Decap recognizes
       our custom "collage_layout" widget.

       Once this works, we will replace this box
       with the actual drag-and-resize editor.
       ====================================================== */


    const CollageControl = createClass({


      render: function(){


        return h(

          "div",


          /* BOX STYLING */

          {

            style: {

              padding: "40px",

              marginTop: "15px",

              border: "2px solid #111",

              background: "#ffffff",

              color: "#111111",

              fontFamily:
                "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",

              fontSize: "18px",

              lineHeight: "1.5"

            }

          },


          /* MESSAGE */

          "Collage editor registered successfully ✓"

        );

      }

    });



    /* ======================================================
       REGISTER OUR CUSTOM WIDGET

       The name here:

       collage_layout

       MUST match:

       widget: "collage_layout"

       inside config.yml.
       ====================================================== */

    CMS.registerWidget(

      "collage_layout",

      CollageControl

    );



    /* ======================================================
       NOW START DECAP

       We register the custom widget BEFORE Decap initializes.
       ====================================================== */

    CMS.init();


  </script>


</body>

</html>
