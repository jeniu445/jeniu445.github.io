<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Jennifer Portfolio Admin</title>


  <!-- =========================================================
       NETLIFY IDENTITY
       ========================================================= -->

  <script
    src="https://identity.netlify.com/v1/netlify-identity-widget.js">
  </script>


  <!-- =========================================================
       MANUAL DECAP INITIALIZATION
       ========================================================= -->

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>


  <!-- =========================================================
       DECAP CMS
       ========================================================= -->

  <script
    src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js">
  </script>


  <style>

    /* =========================================================
       COLLAGE EDITOR
       ========================================================= */

    .collage-editor{
      width:100%;
      margin-top:12px;
    }


    .collage-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:16px;

      margin-bottom:12px;
    }


    .collage-help{
      max-width:720px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:13px;
      line-height:1.5;

      color:#555;
    }


    .collage-reset{
      flex:0 0 auto;

      border:1px solid #bbb;
      border-radius:4px;

      background:#fff;

      padding:7px 11px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:12px;

      cursor:pointer;
    }


    .collage-reset:hover{
      background:#f4f4f4;
    }


    .collage-status{
      padding:24px;

      border:1px solid #ddd;

      background:#fafafa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:14px;

      color:#666;
    }



    /* =========================================================
       VIEWPORT

       This is the visible area inside Decap.

       The actual design artboard underneath is ALWAYS
       1600px wide. We merely scale it visually.
       ========================================================= */

    .collage-viewport{
      position:relative;

      width:100%;

      overflow:hidden;

      border:1px solid #d4d4d4;

      background:#fff;
    }



    /* =========================================================
       FIXED 1600PX DESIGN ARTBOARD
       ========================================================= */

    .collage-artboard{
      position:absolute;

      top:0;
      left:0;

      width:1600px;

      transform-origin:
        top left;

      background:
        linear-gradient(
          to right,
          rgba(0,0,0,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,.035) 1px,
          transparent 1px
        );

      background-size:
        80px 80px;

      user-select:none;

      touch-action:none;
    }



    /* subtle horizontal center guide */

    .collage-center-line{
      position:absolute;

      top:0;
      bottom:0;

      left:800px;

      width:1px;

      background:
        rgba(0,0,0,.08);

      pointer-events:none;
    }



    /* =========================================================
       ARTWORK ITEM
       ========================================================= */

    .collage-item{
      position:absolute;

      box-sizing:border-box;

      cursor:grab;

      border:
        2px solid transparent;

      touch-action:none;
    }


    .collage-item:hover{
      border-color:
        rgba(0,0,0,.35);
    }


    .collage-item.dragging{
      z-index:1000;

      cursor:grabbing;

      border-color:#111;
    }


    .collage-item img{
      display:block;

      width:100%;
      height:auto;

      pointer-events:none;

      user-select:none;

      -webkit-user-drag:none;
    }



    /* =========================================================
       RESIZE HANDLE
       ========================================================= */

    .collage-resize{
      position:absolute;

      right:-10px;
      bottom:-10px;

      width:22px;
      height:22px;

      border:3px solid #111;

      background:#fff;

      cursor:nwse-resize;

      opacity:0;

      transition:
        opacity 100ms ease;
    }


    .collage-item:hover .collage-resize,
    .collage-item.dragging .collage-resize{
      opacity:1;
    }



    /* =========================================================
       PATH LABEL
       ========================================================= */

    .collage-label{
      position:absolute;

      left:0;
      bottom:100%;

      margin-bottom:6px;

      max-width:300px;

      padding:
        5px 8px;

      overflow:hidden;

      white-space:nowrap;

      text-overflow:ellipsis;

      background:
        rgba(0,0,0,.75);

      color:#fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size:14px;

      opacity:0;

      pointer-events:none;
    }


    .collage-item:hover .collage-label{
      opacity:1;
    }

  </style>

</head>


<body>


  <script>

    /* =========================================================
       SHARED DESIGN SYSTEM

       IMPORTANT:

       portfolio.html uses this SAME width.

       Never change one without changing the other.
       ========================================================= */

    const DESIGN_WIDTH =
      1600;


    const MIN_DESIGN_HEIGHT =
      1100;



    /* =========================================================
       HELPERS
       ========================================================= */

    function clamp(
      value,
      min,
      max
    ){

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }



    function normalizeValue(
      value
    ){

      if(!value){
        return [];
      }


      if(
        typeof value.toJS ===
        "function"
      ){

        value =
          value.toJS();

      }


      return Array.isArray(value)
        ? value
        : [];

    }



    /* =========================================================
       CUSTOM COLLAGE CONTROL
       ========================================================= */

    const CollageControl =
      createClass({


        getInitialState:
          function(){

            return{

              loading:true,

              error:null,

              items:[],

              scale:1,

              activeIndex:null

            };

          },



        componentDidMount:
          function(){

            this.loadArtwork();


            window.addEventListener(
              "resize",
              this.updateScale
            );

          },



        componentWillUnmount:
          function(){

            window.removeEventListener(
              "resize",
              this.updateScale
            );


            this.removePointerListeners();

          },



        componentDidUpdate:
          function(){

            /*
              After Decap changes the editor width,
              keep the virtual artboard fitted.
            */

            this.updateScale();

          },



        /* =====================================================
           DETERMINE ARTBOARD SCALE
           ===================================================== */

        updateScale:
          function(){

            if(
              !this.viewportNode
            ){

              return;

            }


            const availableWidth =
              this.viewportNode.clientWidth;


            if(
              !availableWidth
            ){

              return;

            }


            const nextScale =
              Math.min(
                1,
                availableWidth /
                DESIGN_WIDTH
              );


            if(
              Math.abs(
                nextScale -
                this.state.scale
              ) >
              .001
            ){

              this.setState({

                scale:
                  nextScale

              });

            }

          },



        /* =====================================================
           LOAD ARTWORKS.JSON
           ===================================================== */

        loadArtwork:
          async function(){

            try{

              const response =
                await fetch(
                  "/content/artworks.json?v=" +
                  Date.now(),
                  {
                    cache:"no-store"
                  }
                );


              if(
                !response.ok
              ){

                throw new Error(
                  "Could not load artworks.json"
                );

              }


              const data =
                await response.json();


              const artworks =
                Array.isArray(
                  data.artworks
                )
                  ? data.artworks
                  : [];


              const existing =
                normalizeValue(
                  this.props.value
                );



              /*
                ------------------------------------------------
                MIGRATE YOUR OLD PERCENTAGE LAYOUT AUTOMATICALLY

                Your previous editor stored:
                  x     = percent
                  width = percent

                This version stores:
                  x     = design pixels
                  width = design pixels

                If every width is <= 100, we assume the old
                percentage format and convert it once.
                ------------------------------------------------
              */

              const looksLikeOldPercentageData =
                existing.length > 0 &&
                existing.every(
                  item =>

                    Number(
                      item.width
                    ) <= 100

                );



              const savedByImage =
                {};


              existing.forEach(
                function(item){

                  if(
                    !item ||
                    !item.image
                  ){

                    return;

                  }


                  let x =
                    Number(
                      item.x
                    ) || 0;


                  let y =
                    Number(
                      item.y
                    ) || 0;


                  let width =
                    Number(
                      item.width
                    ) || 400;



                  /*
                    Convert old percentage values
                    to the new 1600px artboard.
                  */

                  if(
                    looksLikeOldPercentageData
                  ){

                    x =
                      (
                        x /
                        100
                      ) *
                      DESIGN_WIDTH;


                    width =
                      (
                        width /
                        100
                      ) *
                      DESIGN_WIDTH;

                  }


                  savedByImage[
                    item.image
                  ] = {

                    image:
                      item.image,

                    x:
                      x,

                    y:
                      y,

                    width:
                      width

                  };

                }
              );



              /* =================================================
                 CREATE EDITOR ITEMS
                 ================================================= */

              const items =
                artworks.map(
                  function(
                    artwork,
                    index
                  ){

                    const saved =
                      savedByImage[
                        artwork.image
                      ];


                    if(saved){

                      return saved;

                    }



                    /*
                      Default starter position for a
                      newly uploaded artwork.

                      This does NOT affect single-column view.
                    */

                    const starterPositions = [

                      {
                        x:70,
                        y:80,
                        width:390
                      },

                      {
                        x:570,
                        y:130,
                        width:400
                      },

                      {
                        x:1150,
                        y:100,
                        width:360
                      },

                      {
                        x:240,
                        y:430,
                        width:380
                      },

                      {
                        x:780,
                        y:500,
                        width:370
                      },

                      {
                        x:1180,
                        y:500,
                        width:300
                      }

                    ];


                    const slot =
                      starterPositions[
                        index %
                        starterPositions.length
                      ];


                    const band =
                      Math.floor(
                        index /
                        starterPositions.length
                      );


                    return{

                      image:
                        artwork.image,

                      x:
                        slot.x,

                      y:
                        slot.y +
                        band *
                        700,

                      width:
                        slot.width

                    };

                  }
                );



              this.setState(

                {

                  loading:false,

                  error:null,

                  items:
                    items

                },


                () => {

                  this.updateScale();


                  /*
                    Save migrated/new items into Decap.
                  */

                  this.props.onChange(
                    items
                  );

                }

              );


            }
            catch(error){

              console.error(
                "Collage editor error:",
                error
              );


              this.setState({

                loading:false,

                error:
                  "Could not load artwork. Make sure artworks.json exists on this branch."

              });

            }

          },



        /* =====================================================
           ARTBOARD HEIGHT
           ===================================================== */

        getDesignHeight:
          function(){

            if(
              !this.state.items.length
            ){

              return MIN_DESIGN_HEIGHT;

            }


            const lowestY =
              this.state.items.reduce(
                function(
                  result,
                  item
                ){

                  return Math.max(
                    result,
                    Number(
                      item.y
                    ) || 0
                  );

                },
                0
              );


            return Math.max(

              MIN_DESIGN_HEIGHT,

              lowestY +
              800

            );

          },



        /* =====================================================
           POINTER START
           ===================================================== */

        startPointer:
          function(
            index,
            mode,
            event
          ){

            event.preventDefault();

            event.stopPropagation();


            const item =
              this.state.items[
                index
              ];


            this.dragData = {

              index:
                index,

              mode:
                mode,

              startClientX:
                event.clientX,

              startClientY:
                event.clientY,

              originalX:
                Number(
                  item.x
                ) || 0,

              originalY:
                Number(
                  item.y
                ) || 0,

              originalWidth:
                Number(
                  item.width
                ) || 400

            };


            this.setState({

              activeIndex:
                index

            });


            window.addEventListener(
              "pointermove",
              this.handlePointerMove
            );


            window.addEventListener(
              "pointerup",
              this.handlePointerUp
            );

          },



        /* =====================================================
           POINTER MOVE
           ===================================================== */

        handlePointerMove:
          function(event){

            if(
              !this.dragData
            ){

              return;

            }


            event.preventDefault();


            const drag =
              this.dragData;


            /*
              Convert actual mouse movement into
              DESIGN-SPACE movement.

              Example:
              if editor is displayed at 50% scale,
              moving mouse 50px = moving artwork 100
              design pixels.
            */

            const scale =
              this.state.scale ||
              1;


            const dx =
              (
                event.clientX -
                drag.startClientX
              ) /
              scale;


            const dy =
              (
                event.clientY -
                drag.startClientY
              ) /
              scale;


            const items =
              this.state.items.map(
                item =>
                  Object.assign(
                    {},
                    item
                  )
              );


            const item =
              items[
                drag.index
              ];



            /* MOVE */

            if(
              drag.mode ===
              "move"
            ){

              item.x =
                clamp(

                  drag.originalX +
                  dx,

                  0,

                  DESIGN_WIDTH -
                  item.width

                );


              item.y =
                Math.max(

                  0,

                  drag.originalY +
                  dy

                );

            }



            /* RESIZE */

            if(
              drag.mode ===
              "resize"
            ){

              const desiredWidth =
                clamp(

                  drag.originalWidth +
                  dx,

                  100,

                  1100

                );


              item.width =
                Math.min(

                  desiredWidth,

                  DESIGN_WIDTH -
                  item.x

                );

            }



            this.setState({

              items:
                items

            });

          },



        /* =====================================================
           POINTER END
           ===================================================== */

        handlePointerUp:
          function(){

            if(
              !this.dragData
            ){

              return;

            }


            this.dragData =
              null;


            this.removePointerListeners();


            this.setState({

              activeIndex:null

            });


            /*
              This is what tells Decap the field
              has changed.

              Publish saves these exact design-space
              values into collage.json.
            */

            this.props.onChange(
              this.state.items
            );

          },



        removePointerListeners:
          function(){

            window.removeEventListener(
              "pointermove",
              this.handlePointerMove
            );


            window.removeEventListener(
              "pointerup",
              this.handlePointerUp
            );

          },



        /* =====================================================
           RESET
           ===================================================== */

        resetLayout:
          function(){

            const starterPositions = [

              {
                x:70,
                y:80,
                width:390
              },

              {
                x:570,
                y:130,
                width:400
              },

              {
                x:1150,
                y:100,
                width:360
              },

              {
                x:240,
                y:430,
                width:380
              },

              {
                x:780,
                y:500,
                width:370
              },

              {
                x:1180,
                y:500,
                width:300
              }

            ];


            const items =
              this.state.items.map(
                function(
                  item,
                  index
                ){

                  const slot =
                    starterPositions[
                      index %
                      starterPositions.length
                    ];


                  const band =
                    Math.floor(
                      index /
                      starterPositions.length
                    );


                  return{

                    image:
                      item.image,

                    x:
                      slot.x,

                    y:
                      slot.y +
                      band *
                      700,

                    width:
                      slot.width

                  };

                }
              );


            this.setState({

              items:
                items

            });


            this.props.onChange(
              items
            );

          },



        /* =====================================================
           RENDER ONE ARTWORK
           ===================================================== */

        renderItem:
          function(
            item,
            index
          ){

            const active =
              this.state.activeIndex ===
              index;


            return h(

              "div",

              {

                key:
                  item.image,

                className:
                  "collage-item" +
                  (
                    active
                      ? " dragging"
                      : ""
                  ),

                style:{

                  left:
                    item.x +
                    "px",

                  top:
                    item.y +
                    "px",

                  width:
                    item.width +
                    "px"

                },

                onPointerDown:
                  function(event){

                    this.startPointer(
                      index,
                      "move",
                      event
                    );

                  }.bind(this)

              },



              h(

                "div",

                {
                  className:
                    "collage-label"
                },

                item.image

              ),



              h(

                "img",

                {

                  src:
                    item.image,

                  alt:""

                }

              ),



              h(

                "div",

                {

                  className:
                    "collage-resize",

                  title:
                    "Drag to resize",

                  onPointerDown:
                    function(event){

                      this.startPointer(
                        index,
                        "resize",
                        event
                      );

                    }.bind(this)

                }

              )

            );

          },



        /* =====================================================
           RENDER
           ===================================================== */

        render:
          function(){

            if(
              this.state.loading
            ){

              return h(

                "div",

                {
                  className:
                    "collage-status"
                },

                "Loading artwork..."

              );

            }



            if(
              this.state.error
            ){

              return h(

                "div",

                {
                  className:
                    "collage-status"
                },

                this.state.error

              );

            }



            const designHeight =
              this.getDesignHeight();


            const scale =
              this.state.scale;


            return h(

              "div",

              {
                className:
                  "collage-editor"
              },



              /* TOOLBAR */

              h(

                "div",

                {
                  className:
                    "collage-toolbar"
                },


                h(

                  "div",

                  {
                    className:
                      "collage-help"
                  },

                  "Drag artwork to move it. Drag the square at the bottom-right to resize. The editor and public collage use the exact same 1600px design canvas."

                ),


                h(

                  "button",

                  {

                    type:"button",

                    className:
                      "collage-reset",

                    onClick:
                      this.resetLayout

                  },

                  "Reset layout"

                )

              ),



              /* SCALED VIEWPORT */

              h(

                "div",

                {

                  className:
                    "collage-viewport",

                  ref:
                    function(node){

                      this.viewportNode =
                        node;

                    }.bind(this),

                  style:{

                    height:
                      (
                        designHeight *
                        scale
                      ) +
                      "px"

                  }

                },



                /* FIXED DESIGN ARTBOARD */

                h(

                  "div",

                  {

                    className:
                      "collage-artboard",

                    style:{

                      height:
                        designHeight +
                        "px",

                      transform:
                        "scale(" +
                        scale +
                        ")"

                    }

                  },



                  h(

                    "div",

                    {
                      className:
                        "collage-center-line"
                    }

                  ),



                  this.state.items.map(
                    this.renderItem
                  )

                )

              )

            );

          }

      });



    /* =========================================================
       REGISTER CUSTOM WIDGET
       ========================================================= */

    window.CMS.registerWidget(
      "collage_layout",
      CollageControl
    );



    /* =========================================================
       START DECAP

       Official script-tag manual-init API exposes initCMS.
       ========================================================= */

    window.initCMS();

  </script>


</body>

</html>
